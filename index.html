                No providers match your search.
              </div>
              <div class="divide-y divide-base-content/5">
                <template x-for="(p, i) in filteredProvList" :key="p.id">
                <div class="flex items-start gap-2.5 py-2.5">
                  <label class="cursor-pointer flex items-center mt-0.5" title="Enable / disable">
                    <input type="checkbox" :checked="p.enabled !== false" @change="provToggleEnabled(p, $event)" class="checkbox checkbox-primary checkbox-sm" />
                  </label>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                      <input type="text" x-model="p.name" @input="provFormCommit()" placeholder="Provider name"
                        class="flex-1 min-w-0 bg-transparent text-sm font-mono text-base-content outline-none placeholder:text-base-content/25 border-0" />
                      <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-base-content/40 border border-base-content/10">provider</span>
                      <span class="text-xs font-mono uppercase tracking-wider rounded px-1.5 py-0.5 shrink-0 border" :class="provStatusBadge(p.id)">
                        <span x-show="$store.settings.providerStatus[p.id] === 'checking'" class="braille-loader shrink-0"></span>
                        <i x-show="$store.settings.providerStatus[p.id] !== 'checking'" :data-lucide="provStatusIcon(p.id)" class="w-3 h-3"></i>
                        <span x-text="provStatusLabel(p.id)"></span>
                      </span>
                    </div>
                    <input type="text" x-model="p.baseUrl" @input="provFormCommit()" placeholder="https://api.example.com/v1"

                        <i :data-lucide="provShowKey[p.id] ? 'eye-off' : 'eye'" class="w-3.5 h-3.5"></i>
                      </button>
                      <button type="button" @click="provCheckConnection(p.id)"

                        <i x-show="$store.settings.providerStatus[p.id] !== 'checking'" data-lucide="refresh-cw" class="w-3 h-3"></i>
                        <span x-text="$store.settings.providerStatus[p.id] === 'checking' ? 'Testing…' : 'Test'"></span>
                      </button>

                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button type="button" @click="provRemoveForm(p.id)" title="Delete provider"

                      <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
                </template>
              </div>
            </section>
          </div>

                    <span class="text-sm font-medium text-base-content truncate" :class="w.enabled ? '' : 'opacity-40'" x-text="w.label"></span>

                      :class="w.enabled ? 'text-warning/60 border border-warning/15' : 'text-base-content/30 border border-base-content/10'"
                      x-text="w.method"></span>
                  </div>
                  <div class="flex items-center gap-1.5 text-xs text-base-content/40 truncate mt-0.5 pl-5.5">
                    <span class="font-mono truncate" x-text="'/' + (w.path || '')"></span>
                    <span class="text-base-content/20 shrink-0">·</span>
                    <span class="truncate" x-text="w.agentName"></span>
                  </div>
                </div>
                <button type="button" @click.stop="webhookRemove(w.agentId, w.id)"
                  :title="confirmWebh[w.id] ? 'Click again to confirm' : 'Delete webhook'"
                  class="min-h-7 min-w-7 flex items-center justify-center transition-colors shrink-0 rounded-selector"
                  :class="confirmWebh[w.id] ? 'text-error bg-error/10' : 'text-base-content/30 hover:text-error hover:bg-error/10'">
                  <i :data-lucide="confirmWebh[w.id] ? 'check' : 'trash-2'" class="w-3.5 h-3.5"></i>
                </button>
              </div>
              </template>
            </div>
          </div>
          </template>

          <!-- ═══ SCHEDULE ═══ -->
          <template x-if="activeSettingsTab === 'schedule'">
          <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4 py-3" x-data="schedulerPanel">
            <div class="flex items-center justify-between mb-1.5 sticky top-0 z-10 bg-panel/95 backdrop-blur-sm py-1 -mx-3 sm:-mx-4 px-3 sm:px-4">
              <div class="flex items-center gap-2">
                <i data-lucide="calendar-clock" class="w-3.5 h-3.5 text-accent/60"></i>
                <span class="text-xs font-semibold uppercase tracking-wider text-accent/60">Scheduled</span>
                <span class="text-xs text-base-content/25 font-mono" x-text="$store.crons.items.length"></span>
              </div>
            </div>
            <div x-show="!$store.crons.items.length" class="empty-state gap-3">
              <span class="empty-icon"><i data-lucide="calendar-clock" class="w-5 h-5"></i></span>
              <div>
                <div class="empty-title">Nothing scheduled yet</div>
                <div class="empty-sub">Schedule a prompt or agent to run automatically.</div>
              </div>
              <button @click="focusComposer()" class="inline-flex items-center gap-1.5 text-xs font-medium text-primary/80 hover:text-primary hover:bg-primary/10 rounded-field px-3 min-h-9 transition-colors">Schedule first task</button>
            </div>
            <template x-for="g in cronGroups()" :key="g.id">
              <div>
                <div class="pt-2 pb-1 text-xs font-semibold uppercase tracking-wider text-base-content/35" x-text="g.label"></div>
                <div class="divide-y divide-base-content/5">
                  <template x-for="c in g.items" :key="c.id">
                    <div class="flex items-center gap-3 py-2.5 hover:bg-base-300/30 -mx-2 px-2 transition-colors rounded-selector">
                      <label class="cursor-pointer flex items-center shrink-0" title="Enable / disable">
                        <input type="checkbox" :checked="c.enabled !== false" @change="toggle(c.id)" class="checkbox checkbox-primary checkbox-sm" />
                      </label>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                          <i data-lucide="clock" class="w-3.5 h-3.5 shrink-0" :class="c.enabled !== false ? 'text-accent/50' : 'text-base-content/20'"></i>
                          <span class="text-sm font-medium text-base-content truncate" :class="c.enabled === false ? 'opacity-40' : ''" x-text="c.title"></span>
                          <span class="text-xs font-mono uppercase tracking-wider rounded px-1.5 py-0.5 shrink-0 border" :class="statusBadge(c)" x-text="statusText(c)"></span>
                        </div>
                        <div class="text-xs text-base-content/40 truncate mt-0.5 pl-5.5">
                          <span x-text="repeatLabel(c)"></span>
                          <span class="text-base-content/20"> · next </span>
                          <span class="font-mono" x-text="nextRunShort(c)"></span>
                        </div>
                      </div>
                      <div class="flex items-center gap-1 shrink-0">
                        <button @click="runNow(c.id)" title="Run now"
                          class="min-h-7 min-w-7 flex items-center justify-center text-base-content/30 hover:text-primary hover:bg-base-300/50 transition-colors rounded-selector">
                          <i data-lucide="play" class="w-3.5 h-3.5"></i>
                        </button>
                        <button @click="askDelete(c.id)" :title="confirmDel[c.id] ? 'Click again to confirm' : 'Delete'"
                          class="min-h-7 min-w-7 flex items-center justify-center transition-colors rounded-selector"
                          :class="confirmDel[c.id] ? 'text-error bg-error/10' : 'text-base-content/30 hover:text-error hover:bg-error/10'">
                          <i :data-lucide="confirmDel[c.id] ? 'check' : 'trash-2'" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
            <!-- Schedule composer -->
            <div class="mt-3 border-t border-base-content/10 pt-3">
              <div class="relative bg-base-300 px-3 sm:px-3 pt-2.5 pb-2 rounded-box" @click.outside="whenOpen = false">
                <textarea x-ref="schedTextarea" x-model="prompt"
                  @keydown.enter.prevent="schedule()"
                  @input="autoResize($el)"
                  rows="1"
                  placeholder="Type a prompt to schedule… (Enter to schedule)"
                  class="w-full bg-transparent text-sm text-base-content placeholder:text-base-content/30 outline-none resize-none min-h-11 max-h-[160px] leading-relaxed border-0"></textarea>
                <div class="flex flex-wrap items-center gap-1 pt-1 pb-0.5">
                  <button type="button" @click="whenOpen = !whenOpen"
                    class="flex items-center gap-1.5 min-h-8 px-2.5 border text-xs font-mono transition-all shrink-0 rounded-selector"
                    :class="whenOpen ? 'text-primary border-primary/40 bg-primary/5' : 'text-base-content/60 border-base-content/10 hover:text-base-content hover:border-base-content/25'">
                    <i data-lucide="clock" class="w-3.5 h-3.5 shrink-0"></i>
                    <span class="max-w-32 truncate" x-text="whenLabel"></span>
                    <i data-lucide="chevron-down" class="w-3 h-3 shrink-0 transition-transform" :class="whenOpen ? 'rotate-180' : ''"></i>
                  </button>
                  <div class="flex-1 min-w-0"></div>
                  <div class="relative shrink-0" data-dd="schedharn" x-data
                    x-init="ddRegister('schedharn')">
                    <button @click="$store.dd.toggle('schedharn')" data-dd="schedharn"
                      class="flex items-center gap-1.5 min-h-8 px-2 text-xs text-base-content/60 hover:text-base-content hover:bg-base-300/40 transition-colors rounded-selector">
                      <i data-lucide="layers" class="w-3.5 h-3.5 shrink-0 text-base-content/40"></i>
                      <span class="max-w-20 sm:max-w-32 truncate" x-text="$store.dd.label('schedharn')"></span>
                      <i data-lucide="chevron-down" class="w-3 h-3 text-base-content/30 shrink-0 transition-transform" :class="$store.dd.isOpen('schedharn')?'rotate-180':''"></i>
                    </button>
                    <div x-show="$store.dd.isOpen('schedharn')" x-cloak @click.outside="$store.dd.closeAll()"
                      class="absolute bottom-full mb-1 left-0 bg-base-200 border border-base-content/10 z-50 min-w-44 rounded-box">
                      <div class="p-1"><input type="text" x-model="$store.dd._i['schedharn'].q" @input="$store.dd.setQuery('schedharn',$event.target.value)" @keydown.arrow-down.prevent="$store.dd.highlight('schedharn',1)" @keydown.arrow-up.prevent="$store.dd.highlight('schedharn',-1)" @keydown.enter.prevent="$store.dd.pickHL('schedharn')" @keydown.escape="$store.dd.closeAll()" class="w-full bg-base-300 rounded px-2 py-1 text-xs outline-none placeholder:text-base-content/30" placeholder="Search…" /></div>
                      <div class="max-h-40 overflow-y-auto pb-1">
                        <template x-for="(o,i) in $store.dd.filtered('schedharn')" :key="o.v||'_'"><div @click="$store.dd.pick('schedharn',o.v)" class="px-2.5 py-1 text-xs cursor-pointer" :class="i===$store.dd.hlIndex('schedharn')?'bg-primary/10 text-primary':'text-base-content/70 hover:bg-base-300/50'" x-text="o.l"></div></template>
                        <div x-show="!$store.dd.filtered('schedharn').length" class="px-2 py-2 text-xs text-base-content/30 text-center">No matches</div>
                      </div>
                    </div>
                  </div>
                  <button @click="notifyMe = !notifyMe" :title="notifyMe ? 'Notifications on' : 'Notifications off'"
                    class="min-h-8 min-w-8 flex items-center justify-center transition-colors shrink-0 rounded-selector"
                    :class="notifyMe ? 'text-primary' : 'text-base-content/40 hover:text-base-content'">
                    <i :data-lucide="notifyMe ? 'bell' : 'bell-off'" class="w-4 h-4"></i>
                  </button>
                  <button @click="schedule()" title="Schedule"
                    class="min-h-8 min-w-8 sm:min-w-auto sm:px-2.5 flex items-center justify-center gap-1.5 text-xs font-medium transition-all border-0 rounded-selector"
                    :class="prompt.trim() || agentId ? 'text-primary hover:text-primary/80' : 'text-base-content/20 cursor-not-allowed'"
                    :disabled="!prompt.trim() && !agentId">
                    <i data-lucide="arrow-up" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Schedule</span>
                  </button>
                </div>
                <!-- When panel -->
                <div x-show="whenOpen" x-cloak x-ref="whenPanel" @keydown.escape.stop="whenOpen = false"
                  class="mt-3 bg-base-200 border border-base-content/10 p-3 space-y-3 rounded-box">
                  <div class="flex items-center gap-2">
                    <i data-lucide="clock" class="w-3.5 h-3.5 text-base-content/40 shrink-0"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider text-base-content/40">Schedule when</span>
                  </div>
                  <div class="flex gap-1 p-1 bg-base-300 rounded-selector">
                    <button type="button" @click="setMode('once')" class="flex-1 min-h-8 px-2 rounded-field text-xs font-medium transition-colors"
                      :class="mode === 'once' ? 'bg-panel text-base-content' : 'text-base-content/50 hover:text-base-content'">Once</button>
                    <button type="button" @click="setMode('interval')" class="flex-1 min-h-8 px-2 rounded-field text-xs font-medium transition-colors"
                      :class="mode === 'interval' ? 'bg-panel text-base-content' : 'text-base-content/50 hover:text-base-content'">Every</button>
                    <button type="button" @click="setMode('daily')" class="flex-1 min-h-8 px-2 rounded-field text-xs font-medium transition-colors"
                      :class="mode === 'daily' ? 'bg-panel text-base-content' : 'text-base-content/50 hover:text-base-content'">Daily</button>
                    <button type="button" @click="setMode('weekly')" class="flex-1 min-h-8 px-2 rounded-field text-xs font-medium transition-colors"
                      :class="mode === 'weekly' ? 'bg-panel text-base-content' : 'text-base-content/50 hover:text-base-content'">Weekly</button>
                  </div>
                  <div>
                    <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 mb-1.5" x-text="whenFieldLabel"></div>
                    <input type="datetime-local" x-show="mode === 'once'" x-model="datetime" :min="minDatetime" @change="presetChanged()"
                      class="w-full bg-base-300/60 px-3 py-2 text-sm font-mono text-base-content/80 outline-none border border-base-content/10 focus:border-primary/40 focus:ring-1 focus:ring-primary/20 transition-colors rounded-field" />
                    <div class="flex items-center gap-2" x-show="mode === 'interval'">
                      <input type="number" min="1" x-model="intervalNum" @change="presetChanged()"
                        class="w-20 bg-base-300/60 px-3 py-2 text-sm font-mono text-base-content/80 outline-none border border-base-content/10 focus:border-primary/40 focus:ring-1 focus:ring-primary/20 transition-colors rounded-field" />
                      <select x-model="intervalUnit" @change="presetChanged()" class="flex-1 min-w-0 bg-base-300/60 px-3 py-2 text-sm font-mono text-base-content/60 outline-none border border-base-content/10 focus:border-primary/40 focus:ring-1 focus:ring-primary/20 transition-colors cursor-pointer rounded-field">
                        <option value="seconds">seconds</option>
                        <option value="minutes">minutes</option>
                        <option value="hours">hours</option>
                      </select>
                    </div>
                    <div class="flex items-center gap-2" x-show="mode === 'daily' || mode === 'weekly'">
                      <input type="time" x-model="time" @change="presetChanged()"
                        class="flex-1 min-w-0 bg-base-300/60 px-3 py-2 text-sm font-mono text-base-content/80 outline-none border border-base-content/10 focus:border-primary/40 focus:ring-1 focus:ring-primary/20 transition-colors rounded-field" />
                      <select x-show="mode === 'weekly'" x-model="weekday" @change="presetChanged()" class="flex-1 min-w-0 bg-base-300/60 px-3 py-2 text-sm font-mono text-base-content/60 outline-none border border-base-content/10 focus:border-primary/40 focus:ring-1 focus:ring-primary/20 transition-colors cursor-pointer rounded-field">
                        <option value="0">Sunday</option>
                        <option value="1">Monday</option>
                        <option value="2">Tuesday</option>
                        <option value="3">Wednesday</option>
                        <option value="4">Thursday</option>
                        <option value="5">Friday</option>
                        <option value="6">Saturday</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 mb-1.5">Quick pick</div>
                    <div class="space-y-2">
                      <div x-show="hasPresetGroup('once')">
                        <div class="text-xs font-medium uppercase tracking-wider text-base-content/30 mb-1">Once</div>
                        <div class="grid grid-cols-2 gap-1.5">
                          <template x-for="p in presetsOf('once')" :key="p.key">
                            <button @click="applyPreset(p.key)"
                              class="flex items-center gap-1.5 min-h-9 px-2.5 border text-xs font-medium transition-colors rounded-selector"
                              :class="isPresetActive(p.key) ? 'text-primary border-primary/40 bg-primary/5' : 'text-base-content/60 border-base-content/15 hover:text-primary hover:border-primary/30 hover:bg-primary/5'">
                              <i :data-lucide="p.icon" class="w-3.5 h-3.5 shrink-0 opacity-70"></i>
                              <span class="truncate" x-text="p.label"></span>
                            </button>
                          </template>
                        </div>
                      </div>
                      <div x-show="hasPresetGroup('repeat')">
                        <div class="text-xs font-medium uppercase tracking-wider text-base-content/30 mb-1">Repeat</div>
                        <div class="grid grid-cols-2 gap-1.5">
                          <template x-for="p in presetsOf('repeat')" :key="p.key">
                            <button @click="applyPreset(p.key)"
                              class="flex items-center gap-1.5 min-h-9 px-2.5 border text-xs font-medium transition-colors rounded-selector"
                              :class="isPresetActive(p.key) ? 'text-primary border-primary/40 bg-primary/5' : 'text-base-content/60 border-base-content/15 hover:text-primary hover:border-primary/30 hover:bg-primary/5'">
                              <i :data-lucide="p.icon" class="w-3.5 h-3.5 shrink-0 opacity-70"></i>
                              <span class="truncate" x-text="p.label"></span>
                            </button>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!-- Scheduler toast -->
            <div x-show="toastMsg" x-cloak
              class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] flex items-center gap-2 px-3 py-2 text-xs font-medium rounded-box"
              :class="toastType === 'error' ? 'bg-error text-error-content' : 'bg-success text-success-content'"
              x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 translate-y-2"
              x-transition:enter-end="opacity-100 translate-y-0"
              x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100"
              x-transition:leave-end="opacity-0">
              <span x-text="toastMsg"></span>
            </div>
          </div>
          </template>

          <!-- ═══ PAIRING (sync across devices) ═══ -->
          <template x-if="activeSettingsTab === 'pairing'">
          <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4 py-3 space-y-6">
            <section>
              <p class="text-xs text-base-content/30 mb-3">
                Pair this instance with the desktop app, the Chrome extension, and other web tabs. Everything
                (sessions, settings, agents, memory, schedules, broadcasts) syncs in real time, and tools you
                share can be used from any paired device — tasks run where they have the right environment and
                permissions.
              </p>

              <!-- This device -->
              <div class="border border-base-content/10 rounded-box p-3 mb-3">
                <div class="flex items-center gap-2 mb-2">
                  <i data-lucide="laptop" class="w-4 h-4 shrink-0 text-primary"></i>
                  <span class="text-sm font-medium text-base-content flex-1">This device</span>
                  <span class="badge badge-sm badge-ghost" x-text="pairDevice.platform || 'web'"></span>
                </div>
                <input type="text" x-model="$store.settings.deviceName" @change="$store.settings._save(); pairSync.refresh()"
                  placeholder="Device name"
                  class="w-full bg-base-300 border border-base-content/10 rounded-field text-xs text-base-content px-2 py-1.5 outline-none mb-1.5 placeholder:text-base-content/30" />
                <div class="text-xs font-mono text-base-content/40 truncate" x-text="pairDevice.id"></div>
              </div>

              <!-- Sync status -->
              <div class="flex items-center gap-2.5 border border-base-content/10 rounded-box px-3 py-2.5 mb-3">
                <i data-lucide="wifi" class="w-4 h-4 shrink-0 text-base-content/40"></i>
                <div class="flex-1 min-w-0">
                  <div class="text-sm text-base-content truncate">Live sync</div>
                  <div class="text-xs text-base-content/50 truncate" x-text="pairStatus.hub ? (pairStatus.peers + ' device(s) connected') : 'Not paired to a hub'"></div>
                </div>
                <span class="badge badge-sm" :class="pairStatus.hub ? 'badge-success' : 'badge-ghost'"
                  x-text="pairStatus.hub ? 'Synced' : 'Idle'"></span>
              </div>

              <!-- Paired devices -->
              <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 pt-1 pb-1">Paired devices</div>
              <div x-show="!pairPeers.length" class="text-center py-4 text-xs text-base-content/30">
                No devices paired yet. Connect below — on the web version scan the QR code, elsewhere enter the hub URL + token.
              </div>
              <div class="divide-y divide-base-content/5 mb-3">
                <template x-for="p in pairPeers" :key="p.id">
                <div class="flex items-center gap-2.5 py-2.5">
                  <i data-lucide="cpu" class="w-4 h-4 shrink-0 text-base-content/40"></i>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm text-base-content truncate" x-text="p.name || p.id"></div>
                    <div class="text-xs text-base-content/50 truncate" x-text="(p.platform || 'device') + ' · ' + (Array.isArray(p.sharedTools) ? p.sharedTools.length : 0) + ' tool(s) shared'"></div>
                  </div>
                  <span class="badge badge-sm badge-success" x-show="p.lastSeen">online</span>
                </div>
                </template>
              </div>

              <!-- Connect (manual) -->
              <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 pt-1 pb-1">Connect to a hub</div>
              <div class="divide-y divide-base-content/5 mb-3">
                <div class="flex items-center gap-2.5 py-2.5">
                  <i data-lucide="server" class="w-4 h-4 shrink-0 text-base-content/40"></i>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm text-base-content truncate">Desktop hub URL</div>
                    <div class="text-xs text-base-content/50 truncate">The desktop app prints this on launch (default http://127.0.0.1:8790).</div>
                  </div>
                  <input type="url" x-model="$store.settings.desktopPairUrl" @change="$store.settings._save()" placeholder="http://127.0.0.1:8790"
                    class="shrink-0 w-44 sm:w-56 bg-base-300 border border-base-content/10 rounded-field text-xs text-base-content px-2 py-1.5 outline-none placeholder:text-base-content/30" />
                </div>
                <div class="flex items-center gap-2.5 py-2.5">
                  <i data-lucide="key" class="w-4 h-4 shrink-0 text-base-content/40"></i>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm text-base-content truncate">Pairing token</div>
                    <div class="text-xs text-base-content/50 truncate">Leave blank to auto-discover. Shown next to the hub URL in the desktop console.</div>
                  </div>
                  <input type="text" x-model="$store.settings.desktopPairToken" @change="$store.settings._save()" placeholder="auto"
                    class="shrink-0 w-44 sm:w-56 bg-base-300 border border-base-content/10 rounded-field text-xs font-mono text-base-content px-2 py-1.5 outline-none placeholder:text-base-content/30" />
                </div>
              </div>

              <div class="flex flex-wrap gap-2 mb-3">
                <button @click="pairConnect()" :disabled="pairConnecting" class="btn btn-primary btn-sm" :class="pairConnecting ? 'btn-disabled' : ''">
                  <i data-lucide="plug" class="w-3 h-3"></i>
                  <span x-text="pairConnecting ? 'Connecting…' : (pairStatus.hub ? 'Reconnect' : 'Connect')"></span>
                </button>
                <button @click="pairDisconnect()" class="btn btn-ghost btn-sm text-error border border-error/20">Disconnect</button>
                <button @click="pairCopyLink()" x-show="pairIsWeb" class="btn btn-ghost btn-sm border border-base-content/10">Copy pairing link</button>
              </div>

              <!-- QR code (web version only) -->
              <div x-show="pairIsWeb" class="flex flex-col items-center border border-base-content/10 rounded-box p-4 mb-3">
                <p class="text-xs text-base-content/50 mb-2">Scan to pair another device (opens this app pre-connected):</p>
                <img x-show="pairQrDataUrl" :src="pairQrDataUrl" alt="Pairing QR code" class="w-40 h-40 rounded-box" />
                <div x-show="!pairQrDataUrl" class="w-40 h-40 flex items-center justify-center text-xs text-base-content/30 border border-dashed border-base-content/20 rounded-box">
                  Loading QR…
                </div>
              </div>
            </section>

            <!-- ═══ SHARED TOOLS ═══ -->
            <section>
              <div class="flex items-center gap-2 mb-2">
                <i data-lucide="share-2" class="w-4 h-4 shrink-0 text-base-content/40"></i>
                <span class="text-sm font-medium text-base-content flex-1">Share tools with paired devices</span>
                <span class="badge badge-sm badge-ghost" x-text="pairSharedCount + ' shared'"></span>
              </div>
              <p class="text-xs text-base-content/30 mb-3">
                Paired devices can run the tools you select here. Leave empty to share nothing — devices never
                inherit permissions you haven't granted. Incoming tool calls are blocked unless
                <span class="font-mono text-base-content/50">allowIncomingTools</span> is on.
              </p>
              <label class="flex items-center gap-2.5 py-2 border-b border-base-content/5 cursor-pointer">
                <input type="checkbox" :checked="$store.settings.allowIncomingTools !== false"
                  @change="$store.settings.allowIncomingTools = $event.target.checked; $store.settings._save()" class="checkbox checkbox-primary checkbox-sm" />
                <div class="flex-1 min-w-0">
                  <div class="text-sm text-base-content truncate">Allow incoming tool calls</div>
                  <div class="text-xs text-base-content/50 truncate">Permits paired devices to invoke your shared tools.</div>
                </div>

                    <template x-if="cronsList.length">
                      <div class="divide-y divide-base-content/5">
                        <template x-for="(c, ci) in cronsList" :key="c.id">
                          <div class="flex items-center gap-2.5 py-2.5">
                            <i data-lucide="calendar-clock" class="w-4 h-4 shrink-0 text-base-content/30"></i>
                            <div class="flex-1 min-w-0">
                              <div class="truncate text-sm text-base-content/85" x-text="c.title"></div>
                              <div class="text-xs text-base-content/50 truncate" x-text="c.prompt"></div>
                            </div>
                            <div class="shrink-0 text-right">
                              <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 border"
                                :class="cronStatusBadge(c)"
                                x-text="cronStatusText(c)"></span>
                              <div class="text-xs font-mono text-base-content/30 mt-0.5" x-text="formatNextRun(c)"></div>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!cronsList.length">
                      <div class="py-3 text-center text-xs text-base-content/30">No scheduled tasks. Add one in <span class="text-primary font-medium">Settings → Advanced</span>.</div>
                    </template>
                  </div>

                  <div class="pt-1 pb-2 text-center">
                    <span class="text-xs font-mono text-base-content/25">Page last updated <span x-text="now"></span></span>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- ═══ ACTION → full help page ═══ -->
          <template x-if="separateView && separateView.kind === 'action' && separateView.id !== 'dashboard' && separateView.id !== 'themes' && separateView.id !== 'trajectory'">
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin">
              <div class="min-h-full flex flex-col items-center">
                <div class="w-full  flex-1 flex flex-col bg-panel">
                  <div class="shrink-0 border-b border-base-content/10 bg-panel">
                    <div class="flex items-center gap-1 sm:gap-2 px-3 sm:px-3 py-2.5">
                      <button @click="goBack()"
                        class="min-h-8 min-w-8 flex items-center justify-center text-base-content/40 hover:text-base-content transition-colors rounded-selector shrink-0"
                        title="Close">
                        <i data-lucide="x" class="w-4 h-4"></i>
                                              </button>
                      <span class="w-px h-5 bg-base-content/10 shrink-0"></span>
                      <i data-lucide="keyboard" class="size-4 shrink-0 text-base-content/40"></i>
                      <div class="flex items-baseline gap-1 sm:gap-2 min-w-0 flex-1">
                        <span class="truncate min-w-0 text-sm font-medium text-base-content">Help &amp; shortcuts</span>
                        <span class="hidden sm:inline truncate min-w-0 text-xs font-normal text-base-content/30">Navigate everything from the keyboard</span>
                      </div>
                      <span class="text-xs font-mono text-base-content/25 border border-base-content/10 rounded-field px-1.5 py-0.5 shrink-0 hidden sm:inline">esc</span>
                    </div>
                  </div>
                  <div class="px-3 sm:px-4 py-3">
                    <template x-for="(g, gi) in (separateView.shortcuts || [])" :key="'g' + gi">
                      <div class="mb-5">
                        <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 mb-1" x-text="g.group"></div>
                        <div class="divide-y divide-base-content/5">
                          <template x-for="(s, si) in g.items" :key="'s' + si">
                            <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1 py-1.5">
                              <span class="text-sm text-base-content/70 min-w-0 flex-1" x-text="s.desc"></span>
                              <kbd class="px-1.5 py-0.5 rounded bg-base-300/60 text-xs font-mono text-base-content/70" x-text="s.keys"></kbd>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <p class="mt-3 text-xs text-base-content/40 leading-relaxed">Press <span class="text-primary font-medium">↵</span> to open the highlighted item, or click any preview action below. On desktop, <span class="text-primary font-medium">⌘K</span> opens the palette from anywhere.</p>
                  </div>
                </div>
              </div>
            </div>
          </template>

        </div>
      </template>

      </div>
    </aside>

  </div>

  <div id="zod-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] px-4 py-2 rounded-box text-xs bg-base-200 text-base-content border border-base-content/10 hidden" role="status"></div>

<script type="module" src="./assets/index-ddjfj5jf.js"></script>
</body>
