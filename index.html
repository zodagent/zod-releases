                  <!-- Greeting -->
                  <div class="flex items-start justify-between mb-1">
                    <h1 class="text-2xl sm:text-4xl font-medium text-primary">
                      <span>Good </span><span>there.</span>
                    </h1>
                    <div class="flex flex-col items-end gap-1 shrink-0">
                      <span class="text-xs sm:text-xs text-base-content/30 tabular-nums"
                        x-text="now"></span>
                    </div>
                  </div>
                  <p class="text-xs sm:text-sm text-base-content/50"><span class="text-primary font-medium">Ask anything</span>, or <span class="text-primary font-medium">select a session</span> to continue.</p>

                  <!-- Search Bar -->
                  <button @click="openHubSearch()"
                    class="w-full flex items-center gap-3 bg-base-300 border border-base-200 px-3 py-2.5 mt-3 sm:mt-4 text-left transition-all hover:border-primary/40 hover:bg-base-200 rounded-selector">
                    <i data-lucide="search" class="w-4 h-4 text-base-content/40 shrink-0"></i>
                    <span class="flex-grow w-full min-w-0 text-sm text-base-content/30 truncate leading-none">Search sessions, harnesses, tools, commands…</span>
                    <span class="text-xs font-mono text-base-content/40 bg-base-200 border border-base-content/10 rounded-field px-1.5 py-0.5 shrink-0 hidden sm:inline leading-none">⌘K</span>
                  </button>

                  <!-- Running sessions indicator -->
                  <template x-if="showRunningSession">
                    <div class="w-full mt-3 sm:mt-3 border border-primary/20 bg-primary/5 px-3 py-2.5 rounded-box">
                      <div class="flex items-center gap-2.5">
                        <span class="shrink-0 text-primary"><span class="braille-loader"></span></span>
                        <div class="flex-1 min-w-0">
                          <div class="text-sm font-medium text-primary">Active session</div>
                          <div class="text-xs text-primary/60">
                            <span x-show="workflowRunning">Workflow running...</span>
                            <span x-show="streamingResponse">Streaming response...</span>
                          </div>
                        </div>
                        <button @click="stopAgent()" class="btn btn-xs btn-ghost text-error hover:bg-error/10 border border-error/20" title="Stop the agent">Stop</button>
                        <button @click="openHubSearch()" class="text-xs font-medium text-primary hover:text-primary/80 transition-colors">View all</button>
                      </div>
                    </div>
                  </template>

                  <!-- Prompt Input -->
                  <div class="relative w-full mt-3 sm:mt-4">
                    <div class="border border-base-200 bg-base-300 transition-all focus-within:border-primary focus-within:ring-1 focus-within:ring-primary/20 rounded-box">
                      <textarea x-model="hubPrompt"
                        @keydown.enter.prevent="sendHubPrompt"
                        @input="autoResize($el)"
                        class="w-full bg-transparent text-sm text-base-content placeholder-base-content/30 outline-none resize-none min-h-12 leading-relaxed px-3 pt-3 pb-2 border-0 bg-transparent outline-none"
                        rows="2"
                        placeholder="Ask anything..."></textarea>
                      <div class="flex items-center justify-between px-3 pb-2.5">
                        <div class="flex items-center gap-2 min-w-0">
                          <!-- Harness selector -->
                          <div class="relative shrink-0">
                            <button @click="hubHarnessOpen = !hubHarnessOpen"
                              class="flex items-center gap-1 text-xs font-medium rounded-full leading-none px-2 py-[3px] transition-colors border"
                              :class="selectedHarnessId ? 'text-primary bg-primary/10 border-primary/30' : 'text-base-content/40 hover:text-base-content/70 hover:bg-base-content/5 border-base-content/10'"
                              :title="selectedHarnessId ? 'Running: ' + selectedHarnessLabel : 'Select a harness workflow'">
                              <i data-lucide="layers" class="w-2.5 h-2.5"></i>
                              <span class="hidden sm:inline max-w-[9rem] truncate" x-text="selectedHarnessLabel"></span>
                              <i data-lucide="chevron-down" class="w-2.5 h-2.5 opacity-60"></i>
                            </button>
                            <div x-show="hubHarnessOpen" @click.outside="hubHarnessOpen = false" x-cloak
                              x-effect="hubHarnessOpen && refreshIconsSoon()"
                              class="absolute bottom-full left-0 mb-1 w-64 max-h-72 overflow-y-auto scrollbar-thin bg-base-200 border border-base-content/10 shadow-lg z-50 py-1 rounded-box">
                              <button @click="pickHarness('')"
                                class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-base-content/5"
                                :class="!selectedHarnessId ? 'bg-base-content/10' : ''">
                                <i data-lucide="message-circle" class="w-3.5 h-3.5 text-base-content/40 shrink-0"></i>
                                <span class="flex-1 truncate" x-text="'No harness'"></span>
                                <span class="text-xs font-mono text-base-content/30 shrink-0" x-text="'chat'"></span>
                              </button>
                              <div class="my-1 mx-3 h-px bg-base-content/10"></div>
                              <template x-for="h in harnessOptions" :key="h.id">
                                <button @click="pickHarness(h.id)"
                                  class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-base-content/5"
                                  :class="selectedHarnessId === h.id ? 'bg-base-content/10' : ''">
                                  <i data-lucide="layers" class="w-3.5 h-3.5 text-primary shrink-0"></i>
                                  <span class="flex-1 truncate" x-text="h.name"></span>
                                  <span class="text-xs font-mono text-base-content/30 shrink-0" x-text="h.steps + ' steps'"></span>
                                </button>
                              </template>
                              <div class="my-1 mx-3 h-px bg-base-content/10"></div>
                              <button @click="hubCloseManage()"
                                class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-base-content/5 text-base-content/60">
                                <i data-lucide="settings" class="w-3.5 h-3.5 shrink-0"></i>
                                <span class="flex-1 truncate">Manage harnesses…</span>
                              </button>
                            </div>
                          </div>
                          <span class="text-xs text-base-content/25 font-mono tabular-nums" x-text="hubPrompt.length + '/4000'"></span>
                        </div>
                        <button @click="sendHubPrompt()" :disabled="!hubPrompt.trim()"
                          class="btn btn-sm"
                          :class="hubPrompt.trim() ? 'btn-primary' : 'btn-disabled'"
                          aria-label="Send message">
                          <i data-lucide="arrow-up" class="w-3 h-3"></i>
                          <span class="hidden sm:inline">Send</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  <!-- API Connection -->
                  <div class="w-full mt-3 sm:mt-4 border border-dashed bg-base-300 px-3 py-2.5 transition-all flex items-center gap-3 rounded-box"
                    :class="apiStatus === 'connected' ? 'border-success/30' : apiStatus === 'disconnected' ? 'border-error/30' : 'border-primary/30'">
                    <button @click="checkApiConnection()" :disabled="apiChecking"
                      class="flex-1 min-w-0 flex items-center gap-3 text-left transition-all"
                      :title="apiChecking ? 'Checking connection…' : 'Recheck connection'">
                      <span class="badge badge-sm badge-glass shrink-0 leading-none px-0 flex items-center justify-center w-4 h-4 rounded-full" :class="apiStatusBadge">
                        <i data-lucide="check" class="w-3 h-3" x-show="apiStatus === 'connected'"></i>
                        <i data-lucide="x" class="w-3 h-3" x-show="apiStatus === 'disconnected'"></i>
                        <i data-lucide="key" class="w-3 h-3" x-show="apiStatus === 'no-key'"></i>
                        <span class="braille-loader shrink-0" x-show="apiStatus === 'checking'"></span>
                      </span>
                      <span class="flex-grow w-full min-w-0 text-sm truncate leading-none" x-text="apiStatusDetail"
                        :class="apiStatus === 'no-key' ? 'text-base-content/30' : 'text-base-content'"></span>
                    </button>
                    <button x-show="apiStatus === 'connected'" @click="checkApiConnection()"
                      class="shrink-0 min-h-6 px-2.5 inline-flex items-center justify-center gap-1 text-xs font-medium rounded-full transition-all border border-dashed cursor-pointer"
                      :class="apiChecking ? 'text-base-content/40 border-base-content/20' : 'text-success border-success/40 hover:bg-success/10'"
                      title="Recheck connection">
                      <i data-lucide="refresh-cw" class="w-2.5 h-2.5"></i>
                      <span x-text="apiChecking ? '…' : 'Recheck'"></span>
                    </button>
                    <button x-show="apiStatus !== 'connected' && apiStatus !== 'checking'"
                      @click="openSettingsTab('providers')"
                      class="shrink-0 min-h-6 px-2.5 inline-flex items-center justify-center gap-1 text-xs font-medium rounded-full transition-all border border-dashed"
                      :class="apiStatus === 'disconnected' ? 'text-error border-error/40 hover:bg-error/10' : 'text-primary border-primary/40 bg-primary/10 hover:bg-primary/20'">
                      <i data-lucide="key" class="w-2.5 h-2.5"></i>
                      <span>Configure</span>
                    </button>
                  </div>

                </div>
            </div>
          </div>

                <!-- SEARCH VIEW (full height page like other pages) -->
                <div x-show="hubView === 'search'" x-cloak class="flex-1 min-h-0 flex justify-center overflow-hidden" x-data="hubSearch"
                  x-effect="hubView === 'search' && focusSearchInput()">
                  <div class="w-full max-w-3xl flex flex-col min-h-0 h-full bg-panel">
                    <!-- Header + search bar merged -->
                    <div class="flex items-center gap-1 sm:gap-2 px-3 sm:px-3 py-2.5 border-b border-base-content/10 bg-panel shrink-0">
                      <button @click="back()"
                        class="flex items-center justify-center gap-1.5 text-xs font-medium text-base-content/60 hover:text-primary transition-colors shrink-0 px-1.5 py-1.5 hover:bg-base-content/5 rounded-selector"
                        title="Back to hub (esc)">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Back</span>
                      </button>
                      <span class="w-px h-5 bg-base-content/10 shrink-0"></span>
                      <i data-lucide="search" class="w-4 h-4 text-base-content/40 shrink-0 ml-0.5"></i>
                      <input x-ref="searchInput" x-model="q"
                        @input="hl = 0"
                        @keydown.arrow-down.prevent="move(1)"
                        @keydown.arrow-up.prevent="move(-1)"
                        @keydown.enter.prevent="select()"
                        @keydown.escape="back()"
                        placeholder="Search sessions, harnesses, tools, commands…"
                        class="flex-grow w-full min-w-0 bg-transparent text-sm text-base-content placeholder:text-base-content/30 focus-visible:outline-none border-0 bg-transparent outline-none"
                        aria-label="Search everything">
                      <span x-show="q" @click="clearSearch()" class="text-base-content/30 hover:text-base-content/70 transition-colors shrink-0 cursor-pointer">

<button @click="copyText(m.text)" class="min-h-6 min-w-6 sm:min-h-6 sm:min-w-auto sm:px-2 flex items-center justify-center gap-1 text-xs font-medium text-base-content/25 hover:text-base-content/60 transition-colors" title="Copy">

                          <i data-lucide="arrow-right" class="w-3 h-3 shrink-0"></i>

                      <span x-show="m.stopped" class="text-xs text-warning/70 ml-1">(stopped)</span>
                    </div>
                    <!-- ═══ THINKING (inline) ═══ -->
                    <template x-if="m.thinking && m.thinking.length">
                      <details class="mb-2 group/think">

                        </summary>
                        <div class="mt-1.5 ml-4 pl-3 space-y-1.5">
                          <template x-for="(thought, ti) in (m.thinking || m.thoughts || [])" :key="ti">

                              <div class="text-xs text-base-content/60 leading-relaxed" x-text="thought"></div>
                            </div>
                          </template>
                        </div>
                      </details>
                    </template>
                    <!-- ═══ SECURITY WARNING (inline) ═══ -->
                    <template x-if="m.securityWarning">

                          <span class="text-xs opacity-80 leading-relaxed" x-text="securityText(m)"></span>

                      </div>

                      </div>

                          <span class="flex items-center gap-1 text-xs bg-base-300/60 text-base-content/60 px-2 py-1 border border-base-content/5 rounded-box">
                            <i data-lucide="file" class="w-3 h-3 text-base-content/30"></i>
                            <span x-text="fnameLabel(fname)"></span>
                          </span>
                        </template>
                      </div>
                    </template>
                    <!-- ═══ TASK COMPLETED (inline) ═══ -->
                    <template x-if="m.taskCompleted">
                      <div class="flex items-center gap-1.5 mb-2">
                        <div class="w-3.5 h-3.5 rounded-full bg-success/15 flex items-center justify-center">
                          <i data-lucide="check" class="w-2.5 h-2.5 text-success"></i>
                        </div>
                        <span class="text-xs text-success">Task completed</span>
                      </div>

                    <!-- ═══ SUGGESTIONS (inline) ═══ -->
                    <template x-if="m.suggested && m.suggested.length">
                      <div class="space-y-1 mb-2">

                            </button>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ WORKFLOW (inline) ═══ -->

                        <div class="flex items-center justify-between px-3 py-2 border-b border-base-content/5">
                          <div class="flex items-center gap-2">
                            <i :data-lucide="m.subAgent ? 'users' : 'workflow'" class="w-4 h-4 shrink-0" :class="m.subAgent ? 'text-secondary/60' : 'text-primary/60'"></i>
                            <span class="text-xs font-medium text-base-content/70" x-text="wfName(m)"></span>
                            <span x-show="m.subAgent" class="text-xs font-mono text-secondary/60 bg-secondary/10 border border-secondary/20 rounded px-1 py-0.5">sub-agent</span>
                          </div>
                          <div class="flex items-center gap-1.5">
                            <span x-show="wfTotalSteps(m) !== undefined" class="text-xs text-base-content/30 font-mono" x-text="wfProgress(m)"></span>

                            <span x-show="wfStatus(m) === 'error'" class="badge badge-xs badge-error font-mono">Error</span>
                            <span x-show="wfStatus(m) === 'stopped'" class="badge badge-xs badge-warning font-mono">Stopped</span>

                        <div class="px-3 py-2 space-y-1">

                              <span x-show="s.status === 'running'" class="braille-loader text-primary/70 shrink-0"></span>

                              </div>
                              <div x-show="s.status === 'error'" class="w-5 h-5 rounded-full bg-error/15 flex items-center justify-center shrink-0">
                                <i data-lucide="x" class="w-2.5 h-2.5 text-error"></i>
                              </div>
                              <span class="text-base-content/70" x-text="s.label"></span>
                            </div>
                          </template>
                        </div>
                      </div>

                    <!-- ═══ TOOL-RUNS (inline) ═══ -->

                              <span class="font-medium capitalize text-base-content/80" x-text="tr.name"></span>
                              <span class="group-open/tool:hidden text-xs text-base-content/30 truncate max-w-[8rem]" x-show="tr.result" x-text="toolResultShort(tr)"></span>

                                <span class="braille-loader text-primary/70"></span> Running

                                <i data-lucide="check" class="w-3 h-3"></i> Done

                              <i data-lucide="chevron-down" class="w-3 h-3 text-base-content/30 transition-transform duration-200 group-open/tool:rotate-180 shrink-0"></i>

                                <span class="text-xs font-mono text-base-content/40">Arguments</span>

                                <i data-lucide="file-code" class="w-3 h-3 text-base-content/40"></i>
                                <span class="text-xs font-mono text-base-content/40">Result</span>

                            <div x-show="tr.status === 'running'" class="flex items-center gap-2 text-xs text-base-content/50">
                              <span class="braille-loader text-primary/70"></span>
                              Running...
                            </div>
                          </div>
                        </details>
                      </template>
                    </template>
                    <!-- ═══ CONFIRMATION (inline) ═══ -->

                <span class="text-xs text-base-content font-mono w-8 text-right" x-text="$store.settings.opacity + '%'"></span>

                <span class="text-xs text-base-content font-mono w-8 text-right" x-text="$store.settings.panelOpacity + '%'"></span>

              <div class="flex items-center gap-3 py-2.5">

                <span class="text-xs text-base-content flex-1">Panel Blur</span>

              </div>
            </div>
            <p class="text-xs font-semibold text-base-content uppercase tracking-wider px-3 pt-3 pb-1">Answer Font</p>

                  @input="autoResize($el)"

                      <div class="flex items-center gap-2" x-show="mode === 'daily' || mode === 'weekly'">
                        <input type="time" x-model="time" @change="presetChanged()"
                          class="flex-1 min-w-0 bg-base-300/60 px-3 py-2 text-sm font-mono text-base-content/80 outline-none border border-base-content/10 focus:border-primary/40 focus:ring-1 focus:ring-primary/20 transition-colors rounded-field border-0 bg-transparent outline-none" />
                        <select x-show="mode === 'weekly'" x-model="weekday" @change="presetChanged()" class="flex-1 min-w-0 bg-base-300/60 px-3 py-2 text-sm font-mono text-base-content/60 outline-none border border-base-content/10 focus:border-primary/40 focus:ring-1 focus:ring-primary/20 transition-colors cursor-pointer rounded-field border-0 bg-transparent outline-none">
                          <option value="0">Sunday</option>
                          <option value="1">Monday</option>
                          <option value="2">Tuesday</option>
                          <option value="3">Wednesday</option>
                          <option value="4">Thursday</option>
                          <option value="5">Friday</option>
                          <option value="6">Saturday</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 mb-1.5">Quick pick</div>
                      <div class="space-y-2">
                        <div x-show="hasPresetGroup('once')">
                          <div class="text-xs font-medium uppercase tracking-wider text-base-content/30 mb-1">Once</div>
                          <div class="grid grid-cols-2 gap-1.5">
                            <template x-for="p in presetsOf('once')" :key="p.key">
                              <button @click="applyPreset(p.key)"
                                class="flex items-center gap-1.5 min-h-9 px-2.5 border text-xs font-medium transition-colors rounded-selector"
                                :class="isPresetActive(p.key) ? 'text-primary border-primary/40 bg-primary/5' : 'text-base-content/60 border-base-content/15 hover:text-primary hover:border-primary/30 hover:bg-primary/5'">
                                <i :data-lucide="p.icon" class="w-3.5 h-3.5 shrink-0 opacity-70"></i>
                                <span class="truncate" x-text="p.label"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                        <div x-show="hasPresetGroup('repeat')">
                          <div class="text-xs font-medium uppercase tracking-wider text-base-content/30 mb-1">Repeat</div>
                          <div class="grid grid-cols-2 gap-1.5">
                            <template x-for="p in presetsOf('repeat')" :key="p.key">
                              <button @click="applyPreset(p.key)"
                                class="flex items-center gap-1.5 min-h-9 px-2.5 border text-xs font-medium transition-colors rounded-selector"
                                :class="isPresetActive(p.key) ? 'text-primary border-primary/40 bg-primary/5' : 'text-base-content/60 border-base-content/15 hover:text-primary hover:border-primary/30 hover:bg-primary/5'">
                                <i :data-lucide="p.icon" class="w-3.5 h-3.5 shrink-0 opacity-70"></i>
                                <span class="truncate" x-text="p.label"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
              </div>
            </div>

            <!-- Scheduler toast -->
            <div x-show="toastMsg" x-cloak
              class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] flex items-center gap-2 px-3 py-2 text-xs font-medium rounded-box"
              :class="toastType === 'error' ? 'bg-error text-error-content' : 'bg-success text-success-content'"
              x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 translate-y-2"
              x-transition:enter-end="opacity-100 translate-y-0"
              x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100"
              x-transition:leave-end="opacity-0">
              <span x-text="toastMsg"></span>
            </div>
          </div>

        </div>
        <!-- ═══ EDITOR TABS (outside scroll, full height) ═══ -->
        <div class="flex flex-col min-h-0 overflow-hidden" :class="['providers', 'memory', 'tools', 'mcp', 'harnesses'].includes(activeSettingsTab) ? 'flex-1' : 'h-0'">

          <!-- ═══ PROVIDERS ═══ -->
          <div x-show="activeSettingsTab === 'providers'" class="flex-1 flex flex-col min-h-0">
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4 py-3">
              <p class="text-xs text-base-content/30 mb-2">API providers powering chat and workflows. <span class="text-primary font-medium">Toggle</span> to enable or disable.</p>
              <div x-show="!filteredProvList.length && !$store.settings.providers.length" class="text-center py-6 text-xs text-base-content/30">
                No providers yet. Add one to start chatting.
              </div>
              <div x-show="!filteredProvList.length && $store.settings.providers.length" class="text-center py-6 text-xs text-base-content/30">
                No providers match your search.
              </div>
              <div class="divide-y divide-base-content/5">
                <template x-for="(p, i) in filteredProvList" :key="p.id">
                <div class="flex items-start gap-2.5 py-2.5">
                  <label class="cursor-pointer flex items-center mt-0.5" title="Enable / disable">
                    <input type="checkbox" :checked="p.enabled !== false" @change="provToggleEnabled(p, $event)" class="checkbox checkbox-primary checkbox-sm" />
                  </label>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                      <input type="text" x-model="p.name" @input="provFormCommit()" placeholder="Provider name"
                        class="flex-1 min-w-0 bg-transparent text-sm font-mono text-base-content outline-none placeholder:text-base-content/25 border-0 bg-transparent outline-none" />
                      <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-base-content/40 border border-base-content/10">provider</span>
                      <span class="badge badge-sm badge-glass font-mono shrink-0" :class="provStatusBadge(p.id)">
                        <span x-show="$store.settings.providerStatus[p.id] === 'checking'" class="braille-loader shrink-0"></span>
                        <i x-show="$store.settings.providerStatus[p.id] !== 'checking'" :data-lucide="provStatusIcon(p.id)" class="w-3 h-3"></i>
                        <span x-text="provStatusLabel(p.id)"></span>
                      </span>
                    </div>
                    <input type="text" x-model="p.baseUrl" @input="provFormCommit()" placeholder="https://api.example.com/v1"
                      class="w-full bg-transparent text-xs text-base-content/50 outline-none placeholder:text-base-content/20 truncate border-0 bg-transparent outline-none" />
                    <div class="flex items-center gap-1 mt-0.5">
                      <input :type="provShowKey[p.id] ? 'text' : 'password'" x-model="p.apiKey" @input="provFormCommit()" placeholder="sk-… API key"
                        class="flex-1 min-w-0 bg-transparent text-xs font-mono text-base-content/50 outline-none placeholder:text-base-content/20 border-0 bg-transparent outline-none" />
                      <button type="button" @click="provToggleKey(p.id)" :title="provShowKey[p.id] ? 'Hide' : 'Show'"
                        class="min-h-6 min-w-6 flex items-center justify-center rounded-field text-base-content/40 hover:text-primary transition-colors shrink-0">
                        <i :data-lucide="provShowKey[p.id] ? 'eye-off' : 'eye'" class="w-3.5 h-3.5"></i>
                      </button>
                      <button type="button" @click="provCheckConnection(p.id)"
                        class="inline-flex items-center gap-1 text-xs font-mono text-primary/60 hover:text-primary transition-colors shrink-0"
                        :disabled="$store.settings.providerStatus[p.id] === 'checking'">
                        <span x-show="$store.settings.providerStatus[p.id] === 'checking'" class="braille-loader shrink-0"></span>
                        <i x-show="$store.settings.providerStatus[p.id] !== 'checking'" data-lucide="refresh-cw" class="w-3 h-3"></i>
                        <span x-text="$store.settings.providerStatus[p.id] === 'checking' ? 'Testing…' : 'Test'"></span>
                      </button>
                    </div>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button type="button" @click="provRemoveForm(p.id)" title="Delete provider"
                      class="min-h-7 min-w-7 flex items-center justify-center text-base-content/40 hover:text-error hover:bg-error/10 transition-colors rounded-selector">
                      <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
                </template>
              </div>
            </div>
          </div>

          <!-- ═══ MEMORY ═══ -->
          <div x-show="activeSettingsTab === 'memory'" class="flex-1 flex flex-col min-h-0">
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4">
              <p class="pt-2 pb-1 text-xs text-base-content/30">Facts and preferences the agent remembers across sessions. <span class="text-primary font-medium">Toggle</span> to enable or disable.</p>
              <div class="divide-y divide-base-content/5">
                <template x-for="(b, i) in filteredMemList" :key="i">
                <div class="flex items-start gap-2.5 py-2.5">
                  <label class="cursor-pointer flex items-center mt-0.5" title="Enable / disable">
                    <input type="checkbox" :checked="b.enabled !== false" @change="memToggleEnabled(b, $event)" class="checkbox checkbox-primary checkbox-sm" />
                  </label>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                      <input type="text" x-model="b.title" @input="memFormCommit()" placeholder="Memory title"
                        class="flex-1 min-w-0 bg-transparent text-sm font-mono text-base-content outline-none placeholder:text-base-content/25 border-0 bg-transparent outline-none" />
                      <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-base-content/40 border border-base-content/10">memory</span>
                    </div>
                    <textarea x-model="b.content" @input="memFormCommit()" rows="2" placeholder="What to remember…"
                      class="w-full bg-transparent text-xs text-base-content/50 outline-none placeholder:text-base-content/20 resize-y leading-relaxed border-0 bg-transparent outline-none"></textarea>
                  </div>
                  <button type="button" @click="memRemoveBlock(b)" title="Delete memory"
                    class="min-h-7 min-w-7 flex items-center justify-center text-base-content/40 hover:text-error hover:bg-error/10 transition-colors shrink-0 rounded-selector">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
                </template>
              </div>
              <div x-show="!filteredMemList.length" class="text-center py-6 text-xs text-base-content/30">
                <span x-text="memsQuery.trim() ? 'No memory blocks match your search.' : 'No memory blocks yet. Add a fact or preference to persist across sessions.'"></span>
              </div>
            </div>
          </div>

          <!-- ═══ TOOLS ═══ -->
          <div x-show="activeSettingsTab === 'tools'" class="flex-1 flex flex-col min-h-0">
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4">
              <p class="pt-2 pb-1 text-xs text-base-content/30">Every tool the agent can call in chat and workflows. <span class="text-primary font-medium">Toggle</span> to enable or disable. Add remote tools via <span class="text-primary font-medium">Settings → General → Custom Tools</span>.</p>
              <div class="divide-y divide-base-content/5">
                <template x-for="(t, i) in filteredToolList" :key="t.name + '_' + t.kind">
                <div class="flex items-start gap-2.5 py-2.5">
                  <label class="cursor-pointer flex items-center mt-0.5" title="Enable / disable">
                    <input type="checkbox" :checked="t.enabled" @change="toolToggle(t.name, $event.target.checked)" class="checkbox checkbox-primary checkbox-sm" />
                  </label>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                      <span class="text-sm font-mono text-base-content truncate" :class="t.enabled ? '' : 'opacity-40'" x-text="t.name"></span>
                      <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0"
                        :class="t.kind === 'mcp' ? 'text-info/70 border border-info/20' : t.kind === 'custom' ? 'text-secondary/70 border border-secondary/20' : t.kind === 'chrome' ? 'text-accent/70 border border-accent/20' : t.kind === 'os' ? 'text-warning/70 border border-warning/20' : 'text-base-content/40 border border-base-content/10'"
                        x-text="t.source"></span>
                    </div>
                    <div class="text-xs text-base-content/50 leading-relaxed" x-text="t.description"></div>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button x-show="t.kind === 'custom'" type="button" @click="toolRemoveCustom(t.name)" title="Delete tool"
                      class="min-h-7 min-w-7 flex items-center justify-center text-base-content/40 hover:text-error hover:bg-error/10 transition-colors rounded-selector">
                      <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                  </div>
                </template>
              </div>
              <div x-show="!filteredToolList.length" class="text-center py-6 text-xs text-base-content/30">
                <span x-text="toolsQuery.trim() ? 'No tools match your search.' : 'No tools available.'"></span>
              </div>
            </div>
          </div>

          <!-- ═══ MCP ═══ -->
          <div x-show="activeSettingsTab === 'mcp'" class="flex-1 flex flex-col min-h-0">
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4 py-3">
              <div class="flex items-center justify-between mb-2">
                <p class="text-xs text-base-content/30">Model Context Protocol servers exposing extra tools. <span class="text-primary font-medium">Toggle</span> to enable or disable.</p>
                <button @click="mcpRefreshAll()" class="text-xs text-primary/70 hover:text-primary flex items-center gap-1 transition-colors" :class="_mcpRefreshing ? 'opacity-50 pointer-events-none' : ''" title="Reconnect all enabled servers">
                  <i data-lucide="refresh-cw" class="w-3 h-3" :class="_mcpRefreshing ? 'animate-spin' : ''"></i> Refresh
                </button>
              </div>
              <div x-show="!filteredMcpList.length && !$store.settings.mcpServers.length" class="text-center py-6 text-xs text-base-content/30">
                No MCP servers yet. Add one to connect external tools.
              </div>
              <div x-show="!filteredMcpList.length && $store.settings.mcpServers.length" class="text-center py-6 text-xs text-base-content/30">
                No MCP servers match your search.
              </div>
              <div class="divide-y divide-base-content/5">
                <template x-for="(s, i) in filteredMcpList" :key="i">
                <div class="py-2.5">
                  <div class="flex items-start gap-2.5">
                    <label class="cursor-pointer flex items-center mt-0.5" title="Enable / disable">
                      <input type="checkbox" :checked="s.enabled !== false" @change="mcToggleChange(s, $event)" class="checkbox checkbox-primary checkbox-sm" />
                    </label>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2 mb-1">
                        <div class="flex items-center gap-1.5 min-w-0 flex-1">
                          <template x-if="mcpStatus(s.name).state === 'connected'">
                            <span class="w-2 h-2 rounded-full bg-success shrink-0 animate-pulse" style="animation-duration: 3s" :title="'Connected — ' + mcpStatus(s.name).tools + ' tools'"></span>
                          </template>
                          <template x-if="mcpStatus(s.name).state === 'connecting'">
                            <span class="w-2 h-2 rounded-full bg-warning shrink-0 animate-pulse" title="Connecting…"></span>
                          </template>
                          <template x-if="mcpStatus(s.name).state === 'error'">
                            <span class="w-2 h-2 rounded-full bg-error shrink-0" :title="mcpStatus(s.name).error"></span>
                          </template>
                          <template x-if="mcpStatus(s.name).state === 'disabled'">
                            <span class="w-2 h-2 rounded-full bg-base-content/20 shrink-0" title="Disabled"></span>
                          </template>
                          <template x-if="mcpStatus(s.name).state === 'idle' || mcpStatus(s.name).state === undefined">
                            <span class="w-2 h-2 rounded-full bg-base-content/15 shrink-0" title="Not connected"></span>
                          </template>
                          <input type="text" x-model="s.name" @input="mcpFormCommit()" placeholder="Server name"
                            class="flex-1 min-w-0 bg-transparent text-sm font-mono text-base-content outline-none placeholder:text-base-content/25 border-0 bg-transparent outline-none" />
                        </div>
                        <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-base-content/40 border border-base-content/10">mcp</span>
                      </div>
                      <input type="text" x-model="s.url" @input="mcpFormCommit()" placeholder="https://mcp.example.com/sse"
                        class="w-full bg-transparent text-xs text-base-content/50 outline-none placeholder:text-base-content/20 truncate border-0 bg-transparent outline-none" />
                      <div class="flex items-center gap-2 mt-0.5">
                        <div x-show="s.desc" class="text-xs text-base-content/30" x-text="s.desc"></div>
                        <template x-if="mcpStatus(s.name).state === 'connected'">
                          <span class="text-xs text-success/70 font-medium" x-text="mcpStatus(s.name).tools + ' tools'"></span>
                        </template>
                        <template x-if="mcpStatus(s.name).state === 'error'">
                          <span class="text-xs text-error/70 font-medium truncate max-w-[12rem]" x-text="mcpStatus(s.name).error"></span>
                        </template>
                      </div>
                      <textarea x-model="s._headersText" @blur="mcpHeadersCommit(s)" rows="1" spellcheck="false" placeholder='{ "Authorization": "Bearer …" }'
                        class="w-full bg-transparent font-mono text-xs text-base-content/50 outline-none placeholder:text-base-content/20 resize-y leading-relaxed border-0 bg-transparent outline-none"></textarea>
                      <!-- ═══ Connected tools list ═══ -->
                      <template x-if="mcpStatus(s.name).state === 'connected' && mcpToolsFor(s.name).length">
                        <details class="mt-1.5 group/mcptools">
                          <summary class="flex items-center gap-1.5 text-xs text-success/60 hover:text-success cursor-pointer list-none select-none">
                            <i data-lucide="wrench" class="w-3 h-3"></i>
                            <span class="font-medium">Available tools</span>
                            <span class="text-success/40" x-text="mcpToolsFor(s.name).length"></span>
                            <i data-lucide="chevron-down" class="w-3 h-3 ml-auto transition-transform duration-200 group-open/mcptools:rotate-180"></i>
                          </summary>
                          <div class="mt-1.5 ml-4 pl-3 border-l border-success/10 space-y-1 max-h-40 overflow-y-auto">
                            <template x-for="(tool, ti) in mcpToolsFor(s.name)" :key="ti">
                              <div class="flex items-start gap-1.5">
                                <span class="text-xs font-mono text-success/50 mt-0.5 shrink-0">•</span>
                                <div class="min-w-0">
                                  <span class="text-xs font-mono text-base-content/70" x-text="tool.name"></span>
                                  <span x-show="tool.description" class="text-xs text-base-content/30 ml-1 truncate" x-text="tool.description"></span>
                                </div>
                              </div>
                            </template>
                          </div>
                        </details>
                      </template>
                      <!-- ═══ Error details ═══ -->
                      <template x-if="mcpStatus(s.name).state === 'error'">
                        <div class="mt-1.5 ml-4 pl-3 border-l border-error/20">
                          <span class="text-xs text-error/60 leading-relaxed" x-text="mcpStatus(s.name).error"></span>
                        </div>
                      </template>
                    </div>
                    <button type="button" @click="mcpRemoveServer(s)" title="Delete server"
                      class="min-h-7 min-w-7 flex items-center justify-center text-base-content/40 hover:text-error hover:bg-error/10 transition-colors shrink-0 rounded-selector">
                      <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
                </template>
              </div>
            </div>
          </div>

          <!-- ═══ HARNESSES ═══ -->
          <div x-show="activeSettingsTab === 'harnesses'" class="flex-1 flex flex-col min-h-0">
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4 py-3">
              <p class="text-xs text-base-content/30 mb-2">Workflow harnesses that drive your agent. <span class="text-primary font-medium">Click one</span> to open it in the editor.</p>
              <div x-show="!filteredHarnessList.length && !$store.harnesses.items.length" class="text-center py-6 text-xs text-base-content/30">
                No harnesses yet. Add one to start building workflows.
              </div>
              <div x-show="!filteredHarnessList.length && $store.harnesses.items.length" class="text-center py-6 text-xs text-base-content/30">
                No harnesses match your search.
              </div>
              <div class="divide-y divide-base-content/5">
                <template x-for="(h, i) in filteredHarnessList" :key="h.id">
                <div @click="harnessOpenEditor(h.id)" title="Open in editor"
                  class="flex items-start gap-2.5 py-2.5 cursor-pointer -mx-2 px-2 hover:bg-base-300/40 transition-colors rounded-box">
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                      <span class="text-sm font-mono text-base-content truncate" :class="h.id === $store.harnesses.activeId ? '' : 'opacity-40'" x-text="h.name"></span>
                      <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0"
                        :class="h.id === $store.harnesses.activeId ? 'text-secondary/70 border border-secondary/20' : 'text-base-content/40 border border-base-content/10'"
                        x-text="h.id === $store.harnesses.activeId ? 'Active' : 'harness'"></span>
                    </div>
                    <div class="text-xs text-base-content/50 leading-relaxed" x-text="harnessStepText(h)"></div>
                  </div>
                  <button type="button" @click.stop="harnessRestoreForm(h.id)"
                    :title="confirmRestoreHarn[h.id] ? 'Click again to update to built-in defaults' : 'Update to built-in defaults'"
                    class="min-h-7 min-w-7 flex items-center justify-center transition-colors shrink-0 rounded-selector"
                    :class="confirmRestoreHarn[h.id] ? 'text-success bg-success/10' : 'text-base-content/40 hover:text-primary hover:bg-base-300/50'">
                    <i :data-lucide="confirmRestoreHarn[h.id] ? 'check' : 'refresh-cw'" class="w-3.5 h-3.5"></i>
                  </button>
                  <button type="button" @click.stop="harnessRemoveForm(h.id)"
                    :title="confirmHarn[h.id] ? 'Click again to confirm' : 'Delete harness'"
                    class="min-h-7 min-w-7 flex items-center justify-center transition-colors shrink-0 rounded-selector"
                    :class="confirmHarn[h.id] ? 'text-error bg-error/10' : 'text-base-content/40 hover:text-error hover:bg-error/10'">
                    <i :data-lucide="confirmHarn[h.id] ? 'check' : 'x'" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
                </template>
              </div>
            </div>
          </div>

          </div>

        </div>

        <!-- Notification toast -->
        <div x-show="notification" x-cloak x-transition.opacity.duration.300ms class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-3 py-2 text-xs shadow-lg border rounded-box"
          :class="notificationType === 'error' ? 'bg-error/10 text-error border-error/20' : 'bg-success/10 text-success border-success/20'"
          x-text="notification"></div>
      </div>
  </div>

                </div>
              </div>
            </div>
          </template>

          <!-- ═══ CRON → full task page ═══ -->
          <template x-if="separateView && separateView.kind === 'cron'">
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin">
              <div class="min-h-full flex flex-col items-center">
                <div class="w-full max-w-3xl flex-1 flex flex-col bg-panel">
                  <div class="shrink-0 border-b border-base-content/10 bg-panel">

                            <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 border"
                              :class="s.isStreaming ? 'text-primary border-primary/20' : 'text-success border-success/20'">
                              <span x-show="s.isStreaming">streaming</span>
                              <span x-show="s.isWorkflow && !s.isStreaming">running</span>
                            </span>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!runningSessions.length">
                      <div class="py-3 text-center text-xs text-base-content/30">No active sessions right now.</div>
                    </template>
                  </div>

                  <!-- Recent sessions -->
                  <div>
                    <div class="flex items-center justify-between mb-1">
                      <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40">Recent sessions</div>
                      <span class="text-xs font-mono text-base-content/30 tabular-nums" x-text="recentSessions.length"></span>
                    </div>
                    <template x-if="recentSessions.length">
                      <div class="divide-y divide-base-content/5">
                        <template x-for="(s, si) in recentSessions" :key="s.id">
                          <div class="flex items-center gap-2.5 py-2.5 cursor-pointer hover:bg-base-content/5 px-1 -mx-1 transition-colors rounded-box"
                            @click="openSession(s.id)">
                            <i data-lucide="message-circle" class="w-4 h-4 shrink-0 text-base-content/30"></i>
                            <div class="flex-1 min-w-0">
                              <div class="truncate text-sm font-medium text-base-content" x-text="s.title"></div>
                              <div class="truncate text-xs text-base-content/40" x-text="s.lastMessage || s.messageCount + ' messages'"></div>
                            </div>
                            <span class="text-xs font-mono text-base-content/30 shrink-0" x-text="rel(s.createdAt)"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!recentSessions.length">
                      <div class="py-3 text-center text-xs text-base-content/30">No recent sessions.</div>
                    </template>
                  </div>

                  <!-- Scheduled tasks -->
                  <div>
                    <div class="flex items-center justify-between mb-1">
                      <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40">Scheduled tasks</div>
                      <span class="text-xs font-mono text-base-content/30 tabular-nums" x-text="cronsEnabled + ' enabled · ' + cronsRunningCount + ' running'"></span>
                    </div>
                    <template x-if="cronsList.length">
                      <div class="divide-y divide-base-content/5">
                        <template x-for="(c, ci) in cronsList" :key="c.id">
                          <div class="flex items-center gap-2.5 py-2.5">
                            <i data-lucide="calendar-clock" class="w-4 h-4 shrink-0 text-base-content/30"></i>
                            <div class="flex-1 min-w-0">
                              <div class="truncate text-sm text-base-content/85" x-text="c.title"></div>
                              <div class="text-xs text-base-content/50 truncate" x-text="c.prompt"></div>
                            </div>
                            <div class="shrink-0 text-right">
                              <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5"
                                :class="cronStatusBadge(c) === 'badge-primary' ? 'text-primary border border-primary/20' : cronStatusBadge(c) === 'badge-error' ? 'text-error border border-error/20' : cronStatusBadge(c) === 'badge-success' ? 'text-success border border-success/20' : 'text-base-content/40 border border-base-content/10'"
                                x-text="cronStatusText(c)"></span>
                              <div class="text-xs font-mono text-base-content/30 mt-0.5" x-text="formatNextRun(c)"></div>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!cronsList.length">
                      <div class="py-3 text-center text-xs text-base-content/30">No scheduled tasks. Add one in <span class="text-primary font-medium">Settings → Schedule</span>.</div>
                    </template>
                  </div>

                  <!-- Workspace data -->
                  <div>
                    <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 mb-1">Workspace data</div>
                    <table class="w-full text-sm">
                      <thead>
                        <tr class="text-xs uppercase tracking-wider text-base-content/30 border-b border-base-content/10">
                          <th class="py-2 text-left font-medium">Metric</th>
                          <th class="py-2 text-right font-medium">Count</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-base-content/5">
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Sessions</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="sessionsCount"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Messages</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="messagesCount"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Harnesses</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="harnessesCount"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Workflow steps</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="harnessSteps"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Nested harness links</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="nestedHarnessCount"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Tools enabled</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="toolsEnabled + ' / ' + toolsCount"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Custom tools</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="toolsBySource['Custom'] || 0"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">MCP servers</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="mcpServersCount"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Memory</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="fmtKB(memoryKB)"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Todo list</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="fmtKB(todoKB)"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Notes</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="notesCount"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Data store keys</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="dataStoreCount"></td>
                        </tr>
                        <tr class="hover:bg-base-content/5 transition-colors">
                          <td class="py-2 text-base-content/70">Local storage used</td>
                          <td class="py-2 text-right font-mono tabular-nums text-base-content/85" x-text="fmtKB(storageKB)"></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <!-- Runtime -->
                  <div>
                    <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 mb-1">Runtime</div>
                    <div class="divide-y divide-base-content/5">
                      <div class="py-2.5">
                        <div class="flex items-center justify-between mb-1.5">
                          <span class="text-sm font-medium text-base-content truncate">Active session context</span>
                          <span class="text-xs font-mono text-base-content/50 tabular-nums" x-text="contextTokens + ' tokens · ' + contextPct + '%'"></span>
                        </div>
                        <progress class="progress w-full h-1" :class="contextPct > 80 ? 'progress-error' : contextPct > 50 ? 'progress-warning' : 'progress-success'" :value="contextPct" max="100"></progress>
                      </div>
                      <div class="flex items-center gap-2.5 py-2.5">
                        <i data-lucide="monitor" class="w-4 h-4 shrink-0 text-base-content/40"></i>
                        <div class="flex-1 min-w-0">
                          <div class="text-sm font-medium text-base-content truncate">Session</div>
                          <div class="text-xs text-base-content/50 truncate" x-text="activeSession ? activeSession.title : '—'"></div>
                        </div>
                        <span class="text-xs font-mono text-base-content/60 shrink-0" x-text="activeSession ? rel(activeSession.createdAt) : '—'"></span>
                      </div>
                      <div class="flex items-center gap-2.5 py-2.5">
                        <i data-lucide="clock" class="w-4 h-4 shrink-0 text-base-content/40"></i>
                        <div class="flex-1 min-w-0">
                          <div class="text-sm font-medium text-base-content truncate">Updated</div>
                          <div class="text-xs text-base-content/50 truncate">Live dashboard refresh</div>
                        </div>
                        <span class="text-xs font-mono text-base-content/60 shrink-0" x-text="now"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- ═══ ACTION → full help page ═══ -->
          <template x-if="separateView && separateView.kind === 'action' && separateView.id !== 'dashboard' && separateView.id !== 'themes'">
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin">
              <div class="min-h-full flex flex-col items-center">
                <div class="w-full max-w-3xl flex-1 flex flex-col bg-panel">
                  <div class="shrink-0 border-b border-base-content/10 bg-panel">
                    <div class="flex items-center gap-1 sm:gap-2 px-3 sm:px-3 py-2.5">
                      <button @click="closeSeparate()"
                        class="flex items-center justify-center gap-1.5 text-xs font-medium text-base-content/60 hover:text-primary transition-colors shrink-0 px-1.5 py-1.5 hover:bg-base-content/5 rounded-selector"
                        title="Back (Esc)">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Back</span>
                      </button>
                      <span class="w-px h-5 bg-base-content/10 shrink-0"></span>
                      <i data-lucide="keyboard" class="size-4 shrink-0 text-base-content/40"></i>
                      <div class="flex items-baseline gap-1 sm:gap-2 min-w-0 flex-1">
                        <span class="truncate min-w-0 text-sm font-medium text-base-content">Help &amp; shortcuts</span>
                        <span class="hidden sm:inline truncate min-w-0 text-xs font-normal text-base-content/30">Navigate everything from the keyboard</span>
                      </div>
                      <span class="text-xs font-mono text-base-content/25 border border-base-content/10 rounded-field px-1.5 py-0.5 shrink-0 hidden sm:inline">esc</span>
                    </div>
                  </div>
                  <div class="px-3 sm:px-4 py-3">
                    <template x-for="(g, gi) in (separateView.shortcuts || [])" :key="'g' + gi">
                      <div class="mb-5">
                        <div class="text-xs font-semibold uppercase tracking-wider text-base-content/40 mb-1" x-text="g.group"></div>
                        <div class="divide-y divide-base-content/5">
                          <template x-for="(s, si) in g.items" :key="'s' + si">
                            <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1 py-1.5">
                              <span class="text-sm text-base-content/70 min-w-0 flex-1" x-text="s.desc"></span>
                              <kbd class="px-1.5 py-0.5 rounded bg-base-300/60 text-xs font-mono text-base-content/70" x-text="s.keys"></kbd>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <p class="mt-3 text-xs text-base-content/40 leading-relaxed">Press <span class="text-primary font-medium">↵</span> to open the highlighted item, or click any preview action below. On desktop, <span class="text-primary font-medium">⌘K</span> opens the palette from anywhere.</p>
                  </div>
                </div>
              </div>
            </div>
          </template>

        </div>
      </template>


  </div>

  <div id="zod-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] px-4 py-2 rounded-box text-xs bg-base-200 text-base-content border border-base-content/10 hidden" role="status"></div>

<script type="module" src="./assets/index-m97msvfa.js"></script>
</body>
</html>
