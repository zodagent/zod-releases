              <button @click="createNewSession()" class="min-h-8 min-w-8 flex items-center justify-center text-base-content/40 hover:text-primary transition-colors rounded-selector" title="New chat">
                <i data-lucide="message-square-plus" class="w-4 h-4"></i>
              </button>
              <button @click="sidebarOpen = false" class="min-h-8 min-w-8 flex items-center justify-center text-base-content/40 hover:text-base-content transition-colors rounded-selector" title="Close sidebar (Esc)">
                <i data-lucide="panel-left-close" class="w-4 h-4"></i>
              </button>
            </div>
            <!-- Search everything (sessions, agents, tools, commands...) -->
            <div class="px-3 pb-2">
              <div class="flex items-center gap-2 bg-base-300 border border-base-200 rounded-selector px-3 py-2">
                <i data-lucide="search" class="w-4 h-4 text-base-content/40 shrink-0"></i>
                <input x-ref="searchInput" x-model="q"
                  @input="hl = 0"
                  @keydown.arrow-down.prevent="move(1)"
                  @keydown.arrow-up.prevent="move(-1)"
                  @keydown.enter.prevent="select()"
                  @keydown.escape="back()"
                  placeholder="Search sessions, agents, tools, commands..."
                  class="flex-1 bg-transparent text-sm text-base-content placeholder-base-content/30 outline-none border-0">
                <button x-show="q" @click="clearSearch()" class="text-base-content/30 hover:text-base-content transition-colors shrink-0">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Running sessions indicator -->
          <template x-if="showRunningSession">
            <div class="shrink-0 border-b border-base-content/5 bg-primary/5 px-3 py-2">
              <div class="flex items-center gap-2.5">
                <span class="shrink-0 text-primary"><span class="braille-loader"></span></span>
                <div class="flex-1 min-w-0">
                  <div class="text-xs font-medium text-primary">Active session</div>
                  <div class="text-xs text-primary/60">
                    <span x-show="agentRunning">Agent running...</span>
                    <span x-show="streamingResponse">Streaming...</span>
                  </div>
                </div>
                <button @click="stopAgent()" class="btn btn-xs btn-ghost text-error">Stop</button>
              </div>
            </div>
          </template>

          <!-- Search results: Actions + Settings + Sessions -->
          <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-2 divide-y divide-base-content/5"
            x-effect="scrollIntoView($el, hl)">

            <template x-if="results.length === 0">
              <div class="px-1 py-6 text-center text-xs text-base-content/30">
                <div class="flex flex-col items-center gap-2">
                  <i data-lucide="search" class="w-5 h-5 text-base-content/20"></i>
                  <span>No results for "<span x-text="q"></span>"</span>
                </div>
              </div>
            </template>

            <template x-for="(g, gi) in groups" :key="g.label">
              <div>
                <div class="pt-2 pb-0.5 px-2 text-xs font-semibold uppercase tracking-wider text-base-content/40" x-text="g.label"></div>
                <template x-for="(r, ri) in g.items" :key="r.id">
                  <div :data-hl="hl === r._idx ? '' : null"
                    :class="hl === r._idx ? 'bg-base-content/10' : 'hover:bg-base-content/5'"
                    class="flex items-center gap-1 px-2 transition-colors rounded-box">
                    <button @click="go(r)" class="flex-1 min-w-0 flex items-center gap-3 py-2 text-left">
                      <span x-show="r.isRunning" class="shrink-0 text-primary"><span class="braille-loader"></span></span>
                      <i x-show="!r.isRunning" :data-lucide="r.icon" class="size-4 shrink-0 text-base-content/40"></i>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                          <div class="truncate text-sm text-base-content" x-effect="setTitle($el, r)"></div>
                          <span x-show="r.isStreaming" class="text-[10px] font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-primary border border-primary/20">streaming</span>
                          <span x-show="r.isAgentRunning && !r.isStreaming" class="text-[10px] font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-success border border-success/20">running</span>
                        </div>
                        <div class="truncate text-xs text-base-content/40" x-text="r.hint"></div>
                      </div>
                      <span class="shrink-0 text-xs text-base-content/40" x-text="r.meta"></span>
                    </button>
                    <button x-show="r.kind === 'session'" @click="removeSessionResult(r)"
                      :title="confirmDelete[r.id] ? 'Click again to confirm' : 'Delete chat'"
                      class="shrink-0 min-h-7 min-w-7 flex items-center justify-center transition-colors rounded-selector"
                      :class="confirmDelete[r.id] ? 'text-error bg-error/10' : 'text-base-content/40 hover:text-error hover:bg-error/10'">
                      <i :data-lucide="confirmDelete[r.id] ? 'check' : 'trash-2'" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </template>
              </div>
            </template>
          </div>

        </div>
      </div>
    </aside>

                        <i data-lucide="chevron-down" class="w-3 h-3 text-base-content/30 transition-transform duration-200 group-open/llm:rotate-180 shrink-0"></i>

                          <span class="text-xs text-base-content/35">Wire format — what was sent to the API, exactly.</span>
                          <div class="flex items-center gap-1">
                            <button @click.stop="copyTrace(m)" class="flex items-center gap-1 text-xs font-medium text-base-content/35 hover:text-primary transition-colors px-1.5 py-0.5 rounded hover:bg-base-content/5" title="Copy full request as JSON">
                              <i data-lucide="copy" class="w-3 h-3"></i><span class="hidden sm:inline">Copy JSON</span>
                            </button>
                          </div>
                        </div>
                        <template x-for="(mm, mi) in (m.llmRequest && m.llmRequest.messages) || []" :key="'mm-' + mi">
                          <details class="rounded border border-base-content/10 bg-base-300/40 overflow-hidden group/reqmsg">
                            <summary class="flex items-center gap-1.5 px-2 py-1.5 cursor-pointer list-none select-none">
                              <span class="text-xs font-mono uppercase tracking-wider px-1.5 py-0.5 rounded shrink-0" :class="roleChipClass(mm.role)" x-text="mm.role"></span>
                              <span x-show="mm.role === 'tool'" class="text-xs font-mono text-base-content/40 shrink-0 truncate max-w-[8rem]" x-text="mm.tool_call_id || ''"></span>
                              <span x-show="llmMsgToolNames(mm).length" class="text-xs font-mono text-warning/70 shrink-0" x-text="llmMsgToolNames(mm).join(', ')"></span>
                              <span class="ml-auto text-xs text-base-content/30 shrink-0" x-text="llmMsgLen(mm) + ' ch'"></span>
                              <i data-lucide="chevron-down" class="w-3 h-3 text-base-content/30 transition-transform duration-200 group-open/reqmsg:rotate-180 shrink-0"></i>
                            </summary>
                            <div class="px-2 pb-2 pt-1">
                              <div x-show="llmMsgPreview(mm)" class="mb-1 text-xs text-base-content/30 truncate" x-text="llmMsgPreview(mm)"></div>
                              <pre class="p-2 text-xs text-base-content/60 font-mono leading-relaxed whitespace-pre-wrap max-h-72 overflow-y-auto" x-text="llmMsgText(mm)"></pre>
                            </div>
                          </details>
                        </template>
                        <div x-show="m.llmRequest && m.llmRequest.toolNames && m.llmRequest.toolNames.length" class="flex flex-wrap gap-1 pt-1 items-center">
                          <span class="text-xs text-base-content/30">tools:</span>
                          <template x-for="(tn, ti) in (m.llmRequest && m.llmRequest.toolNames) || []" :key="'tn-' + ti">
                            <span class="text-xs font-mono rounded px-1.5 py-0.5 bg-base-content/10 text-base-content/50 border border-base-content/10" x-text="tn"></span>
                          </template>
                        </div>
                      </div>
                    </details>
                  </div>
                </template>

                <!-- ═══ SYSTEM ═══ -->
                <div x-show="m.role === 'system' && !m.compressed" class="flex justify-center">
                  <div class="text-xs text-base-content/25 bg-base-300/50 px-2.5 py-1 rounded-full select-none"><span x-text="m.text"></span></div>
                </div>

                <!-- ═══ COMPRESSED SESSION SUMMARY ═══ -->
                <div x-show="m.role === 'system' && m.compressed" class="flex justify-center">
                  <details class="group/comp max-w-[95%] w-full bg-base-200/50 border border-warning/20 overflow-hidden rounded-box" open>
                    <summary class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs cursor-pointer list-none select-none">
                      <i data-lucide="shrink" class="w-3 h-3 text-warning/60 shrink-0"></i>
                      <span class="font-semibold text-base-content/60">Session compressed</span>
                      <span class="text-xs text-base-content/30 shrink-0" x-text="m.time"></span>
                      <i data-lucide="chevron-down" class="w-3 h-3 ml-auto text-base-content/30 transition-transform duration-200 group-open/comp:rotate-180 shrink-0"></i>
                    </summary>
                    <div class="px-2.5 pb-2 pt-1 prose prose-sm text-base-content/60 [&_>*:first-child]:mt-0 [&_>*:last-child]:mb-0" x-effect="renderChatHtml($el, m.text)"></div>
                  </details>
                </div>

                <!-- ═══ USER→LLM SENT TRACE (collapsed) ═══ -->
                <template x-if="m.role === 'user-llm'">
                  <div class="flex justify-center">
                    <details class="group/usr max-w-[95%] w-full bg-base-200/50 border border-primary/15 overflow-hidden rounded-box">
                      <summary class="flex flex-wrap items-center gap-x-1.5 gap-y-1 px-2.5 py-1.5 text-xs cursor-pointer list-none select-none">
                        <i data-lucide="user-round" class="w-3 h-3 text-primary/60 shrink-0"></i>
                        <span class="font-semibold text-base-content/60">User sent</span>
                        <span class="font-mono text-base-content/30 whitespace-nowrap" x-text="(m.userRequest && m.userRequest.role) || 'user'"></span>
                        <span x-show="m.userRequest && m.userRequest.content" class="text-base-content/30 whitespace-nowrap" x-text="((m.userRequest && m.userRequest.content) || '').length + ' ch'"></span>
                        <span x-show="m.userRequest && m.userRequest.fileCount" class="text-info/70 whitespace-nowrap" x-text="'· ' + m.userRequest.fileCount + ' file' + (m.userRequest.fileCount === 1 ? '' : 's')"></span>
                        <span class="text-base-content/25 whitespace-nowrap ml-auto" x-text="m.time"></span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-base-content/30 transition-transform duration-200 group-open/usr:rotate-180 shrink-0"></i>
                      </summary>
                      <div class="px-2.5 pb-2 pt-1 space-y-1.5">
                        <div class="flex items-center justify-between gap-2 mb-1">
                          <span class="text-xs text-base-content/35">Exactly as serialized into the user message sent to the LLM.</span>
                          <button @click.stop="copyUserTrace(m)" class="flex items-center gap-1 text-xs font-medium text-base-content/35 hover:text-primary transition-colors px-1.5 py-0.5 rounded hover:bg-base-content/5" title="Copy message text">
                            <i data-lucide="copy" class="w-3 h-3"></i><span class="hidden sm:inline">Copy</span>
                          </button>
                        </div>
                        <div class="rounded border border-base-content/10 bg-base-300/40 overflow-hidden">
                          <div class="flex items-center gap-2 px-2 py-1 border-b border-base-content/5 bg-base-300/30">
                            <span class="text-xs font-mono uppercase tracking-wider px-1.5 py-0.5 rounded" :class="roleChipClass('user')">user</span>
                            <span class="text-xs text-base-content/40" x-text="((m.userRequest && m.userRequest.content) || '').length + ' chars'"></span>
                          </div>
                          <div x-show="((m.userRequest && m.userRequest.content) || '').length > 0" class="p-2 text-xs text-base-content/60 font-mono leading-relaxed whitespace-pre-wrap max-h-72 overflow-y-auto" x-text="(m.userRequest && m.userRequest.content) || ''"></div>
                        </div>
                      </div>
                    </details>
                  </div>
                </template>

                <!-- ═══ DIVIDER ═══ -->
                <div x-show="m.role === 'divider'" class="flex items-center gap-3 my-2">
                  <div class="flex-1 h-px bg-base-content/10"></div>
                  <span class="text-xs text-base-content/25 font-medium" x-text="m.text"></span>
                  <div class="flex-1 h-px bg-base-content/10"></div>
                </div>

                <!-- ═══ USER MESSAGE ═══ -->
                <div x-show="m.role === 'user'" class="msg-enter flex flex-col items-end gap-0 group/message"
                     @touchstart.passive="swipeStart($event, i)" @touchmove.passive="swipeMove($event)" @touchend="swipeEnd()"
                     @contextmenu.prevent="openContextMenu($event, i)"
                     :style="swipeState.active && swipeState.msgIndex === i ? 'transform: translateX(' + swipeState.currentX + 'px); transition: transform 0.1s ease' : ''">
                  <div class="max-w-[90%] sm:max-w-[85%]">
                    <!-- Sender name in group chats -->
                    <div x-show="$store.sessions.activeSession && $store.sessions.activeSession.type === 'group' && m.senderName" class="mb-1 text-xs font-medium text-primary/60 text-right" x-text="m.senderName"></div>
                    <div x-show="userMsgType(m)" class="mb-1 text-xs font-semibold uppercase tracking-wider text-primary/70 bg-primary/10 border border-primary/20 rounded px-2 py-0.5 w-fit" x-text="userMsgType(m)"></div>
                    <!-- ═══ THINKING (inline) ═══ -->
                    <template x-if="m.thinking && m.thinking.length">
                      <details class="mb-2 group/think">
                        <summary class="flex items-center gap-1.5 text-xs text-base-content/50 hover:text-base-content/70 cursor-pointer list-none">
                          <i data-lucide="brain" class="w-3 h-3 shrink-0"></i>
                          <span class="font-medium">Thinking</span>
                          <span class="group-open/think:hidden text-xs text-base-content/30 truncate max-w-[10rem] ml-1" x-text="'(' + (m.thinking || m.thoughts || []).length + ')'"></span>
                          <i data-lucide="chevron-down" class="w-3 h-3 ml-auto transition-transform duration-200 group-open/think:rotate-180"></i>
                        </summary>
                        <div class="mt-1.5 ml-4 pl-3 space-y-1.5">
                          <template x-for="(thought, ti) in (m.thinking || m.thoughts || [])" :key="ti">
                            <div class="flex items-start gap-2">
                              <div class="w-1.5 h-1.5 rounded-full bg-accent/40 mt-1 shrink-0"></div>
                              <div class="text-xs text-base-content/60 leading-relaxed" x-text="thought"></div>
                            </div>
                          </template>
                        </div>
                      </details>
                    </template>
                    <!-- ═══ SECURITY WARNING (inline) ═══ -->
                    <template x-if="m.securityWarning">
                      <div class="border border-error/20 bg-error/10 rounded-box px-3 py-2 mb-2 flex items-start gap-2" role="alert">
                        <i data-lucide="octagon-alert" class="w-3.5 h-3.5 shrink-0 mt-0.5 text-error"></i>
                        <div>
                          <span class="text-xs font-semibold block mb-0.5 text-error" x-text="securityTitle(m)"></span>
                          <span class="text-xs text-base-content/60 leading-relaxed" x-text="securityText(m)"></span>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ FINDINGS (inline) ═══ -->
                    <template x-if="m.findings && m.findings.length">
                      <div class="bg-base-300 flex flex-col border border-base-content/10 rounded-box px-3 py-2 mb-2 overflow-x-auto max-w-full">
                        <div class="flex items-center gap-1.5 mb-2">
                          <i data-lucide="list-checks" class="w-3.5 h-3.5 text-base-content/40"></i>
                          <span class="text-xs font-medium text-base-content/60">Findings</span>
                        </div>
                        <div class="space-y-1.5">
                          <template x-for="(f, fi) in (m.findings || [])" :key="fi">
                            <div class="flex items-start gap-2">
                              <div class="w-3 h-3 rounded-full flex items-center justify-center mt-0.5 shrink-0"
                                :class="f.status === 'success' ? 'border border-success/50' : 'border border-warning/50'">
                                <i :data-lucide="f.status === 'success' ? 'check' : 'minus'" class="w-2 h-2"
                                  :class="f.status === 'success' ? 'text-success' : 'text-warning'"></i>
                              </div>
                              <span class="text-xs text-base-content/60 leading-relaxed" x-text="f.text"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ BADGES (inline) ═══ -->
                    <template x-if="m.badges && m.badges.length">
                      <div class="flex flex-wrap gap-1 mb-2">
                        <template x-for="(badge, bi) in (m.badges || [])" :key="bi">
                          <span class="text-xs font-mono rounded px-1.5 py-0.5 border"
                            :class="badge.startsWith('#') ? 'bg-info/10 text-info border-info/20' : badge.startsWith('!') ? 'bg-error/10 text-error border-error/20' : badge.startsWith('$') ? 'bg-secondary/10 text-secondary border-secondary/20' : badge.startsWith('@') ? 'bg-primary/10 text-primary border-primary/20' : 'bg-base-content/10 text-base-content/60 border-base-content/20'"
                            x-text="badge"></span>
                        </template>
                      </div>
                    </template>
                    <!-- ═══ CODE (inline) ═══ -->
                    <template x-if="m.code">
                      <div class="bg-base-300 flex flex-col border border-base-content/10 rounded-box overflow-hidden mb-2">
                        <div class="flex items-center gap-2 px-2.5 py-1 border-b border-base-content/5 bg-base-300/30">
                          <i data-lucide="code" class="w-3 h-3 text-base-content/40"></i>
                          <span class="text-xs text-base-content/40 font-mono" x-text="m.language || 'code'"></span>
                        </div>
                        <div class="p-2 overflow-x-auto">
                          <pre class="text-xs text-base-content/70 font-mono leading-relaxed whitespace-pre-wrap"><span x-text="m.code || m.text"></span></pre>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ TEXT BUBBLE (excludes special roles) ═══ -->
                    <div x-show="m.replyTo" class="msg-reply-quote flex items-center gap-1.5 px-2 py-1 mb-1 rounded text-xs text-base-content/60 cursor-pointer"
                         @click="m.replyTo && scrollToMessage(m.replyTo.index)">
                      <i data-lucide="corner-up-left" class="w-3 h-3 shrink-0 text-primary/60"></i>
                      <span class="font-medium text-primary/70" x-text="m.replyTo && (m.replyTo.agent || m.replyTo.role)"></span>
                      <span class="truncate" x-text="m.replyTo && m.replyTo.text"></span>
                    </div>
                    <div x-show="isTextRole(m)" class="bg-base-300 border border-base-300/30 rounded-br-md px-2.5 sm:px-3 py-2 rounded-box">
                        <div class="prose text-base-content/85" x-effect="renderChatHtml($el, m.text)"></div>
                      </div>
                    <!-- ═══ REACTIONS (user) ═══ -->
                    <div x-show="(m.reactions || []).length" class="flex flex-wrap gap-1 mt-1 justify-end">
                      <template x-for="(r, ri) in (m.reactions || [])" :key="r.emoji">
                        <button @click="toggleReaction(i, r.emoji)"
                                class="reaction-badge inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full text-xs border transition-all duration-150"
                                :class="r.userReacted ? 'bg-primary/20 border-primary/40 text-primary' : 'bg-base-content/5 border-base-content/10 text-base-content/60 hover:bg-base-content/10'">
                          <span x-text="r.emoji"></span>
                          <span x-show="r.count > 1" x-text="r.count" class="font-mono"></span>
                        </button>
                      </template>
                    </div>
                    <!-- ═══ TODOS (inline) ═══ -->
                    <template x-if="m.todos && m.todos.length">
                      <div class="bg-base-300 flex flex-col border border-base-content/10 rounded-box px-3 py-2 mb-2 overflow-x-auto max-w-full">
                        <div class="flex items-center gap-1.5 mb-2">
                          <i data-lucide="list-checks" class="w-3.5 h-3.5 text-base-content/40"></i>
                          <span class="text-xs font-medium text-base-content/60">To-Do</span>
                        </div>
                        <div class="space-y-1">
                          <template x-for="(t, ti) in (m.todos || [])" :key="ti">
                            <div class="flex items-start gap-2">
                              <input type="checkbox" :checked="t.status === 'done'" class="checkbox checkbox-xs mt-0.5" :class="t.status === 'done' ? 'checkbox-success' : ''">
                              <span class="text-xs text-base-content/70" :class="t.status === 'done' ? 'line-through text-base-content/30' : ''" x-text="t.text"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ TASK COMPLETED (inline) ═══ -->
                    <template x-if="m.taskCompleted">
                      <div class="flex items-center gap-1.5 mb-2">
                        <div class="w-3.5 h-3.5 rounded-full bg-success/15 flex items-center justify-center">
                          <i data-lucide="check" class="w-2.5 h-2.5 text-success"></i>
                        </div>
                        <span class="text-xs text-success">Task completed</span>
                      </div>
                    </template>
                    <!-- ═══ SUGGESTIONS (inline) ═══ -->
                    <template x-if="(m.suggested || m.suggestions) && (m.suggested || m.suggestions).length">
                      <div class="space-y-1 mb-2">
                        <span class="text-xs text-base-content/30">Suggested:</span>
                        <div class="space-y-1">
                          <template x-for="(sug, si) in (m.suggested || m.suggestions || [])" :key="si">
                            <button class="w-full flex items-center justify-between text-xs bg-base-300/60 hover:bg-base-300 text-base-content/60 hover:text-base-content px-3 py-2 sm:py-1.5 transition-colors text-left rounded-selector"
                              @click="pickSuggestion(sug)">
                              <span x-text="sugText(sug)"></span>
                              <i data-lucide="arrow-right" class="w-3.5 h-3.5 shrink-0 text-base-content/20"></i>
                            </button>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ HTML (inline) ═══ -->
                    <template x-if="m.html">
                      <div class="mb-2 rounded-box border border-base-content/10 bg-base-300 p-3">
                        <div class="[&_>*:first-child]:mt-0 [&_>*:last-child]:mb-0" x-effect="sanitizeHtmlNode($el, m.html)"></div>
                      </div>
                    </template>
                    <!-- ═══ VIZ (inline) ═══ -->
                    <template x-if="m.viz">
                      <div class="bg-base-300 flex flex-col border border-base-content/10 rounded-box px-3 py-2 mb-2 overflow-x-auto max-w-full">
                        <div class="flex items-center gap-1.5 mb-2">
                          <i data-lucide="bar-chart-3" class="w-3.5 h-3.5 text-primary/60"></i>
                          <span class="text-xs font-medium text-base-content/60" x-text="vizTitle(m)"></span>
                        </div>
                        <div class="flex items-end gap-2 h-16 px-1">
                          <template x-for="(d, di) in vizData(m)" :key="di">
                            <div class="flex-1 flex flex-col items-center gap-1">
                              <div class="w-full bg-primary/30 rounded-t" :style="'height:' + d.value + 'px'"></div>
                              <span class="text-xs text-base-content/40" x-text="d.label"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ FILES (inline) ═══ -->
                    <div x-show="m.files && m.files.length" class="mt-1 space-y-1">
                      <template x-for="(f, fi) in (m.files || [])" :key="fi">
                        <div class="flex items-center gap-2 bg-base-300/50 border border-base-300/20 px-2.5 py-1.5 rounded-box">
                          <i data-lucide="file" class="w-3.5 h-3.5 shrink-0 text-base-content/40"></i>
                          <div class="min-w-0 flex-1">
                            <div class="text-xs text-base-content/60 truncate" x-text="f.name || f.fileName"></div>
                            <div class="text-xs text-base-content/40" x-text="f.type ? f.type + (f.size ? ' - ' + f.size : '') : f.fileSize || ''"></div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                  <div class="flex flex-wrap items-center gap-0.5 mt-1 mr-0.5 opacity-0 group-hover/message:opacity-100 transition-opacity duration-150">
                    <button @click="startReply(i)" class="min-h-6 min-w-6 sm:min-h-6 sm:min-w-auto sm:px-2 flex items-center justify-center gap-1 text-xs font-medium text-base-content/25 hover:text-primary transition-colors" title="Reply">
                      <i data-lucide="reply" class="w-3 h-3"></i>
                      <span class="hidden sm:inline">Reply</span>
                    </button>
                    <button @click="openReactionPicker($event, i)" class="min-h-6 min-w-6 sm:min-h-6 sm:min-w-auto sm:px-2 flex items-center justify-center gap-1 text-xs font-medium text-base-content/25 hover:text-primary transition-colors" title="React">
                      <i data-lucide="smile-plus" class="w-3 h-3"></i>
                    </button>
                    <button @click="editMessage(i)" class="min-h-6 min-w-6 sm:min-h-6 sm:min-w-auto sm:px-2 flex items-center justify-center gap-1 text-xs font-medium text-base-content/25 hover:text-primary transition-colors" title="Edit">
                      <i data-lucide="pencil" class="w-3 h-3"></i>
                      <span class="hidden sm:inline">Edit</span>
                    </button>
                    <button @click="copyText(m.text)" class="min-h-6 min-w-6 sm:min-h-6 sm:min-w-auto sm:px-2 flex items-center justify-center gap-1 text-xs font-medium text-base-content/25 hover:text-base-content/60 transition-colors" title="Copy">
                      <i data-lucide="copy" class="w-3 h-3"></i>
                      <span class="hidden sm:inline">Copy</span>
                    </button>
                    <button @click="togglePin(i)" class="min-h-6 min-w-6 sm:min-h-6 sm:min-w-auto sm:px-2 flex items-center justify-center gap-1 text-xs font-medium transition-colors" :class="m.pinned ? 'text-warning' : 'text-base-content/25 hover:text-warning'" :title="m.pinned ? 'Unpin' : 'Pin'">
                      <i data-lucide="pin" class="w-3 h-3"></i>
                    </button>
                    <button @click="deleteMessage(i)" class="min-h-6 min-w-6 sm:min-h-6 sm:min-w-auto sm:px-2 flex items-center justify-center gap-1 text-xs font-medium text-base-content/25 hover:text-error transition-colors" title="Delete">
                      <i data-lucide="trash-2" class="w-3 h-3"></i>
                      <span class="hidden sm:inline">Delete</span>
                    </button>
                    <button @click="openForwardPicker(i)" class="min-h-6 min-w-6 sm:min-h-6 sm:min-w-auto sm:px-2 flex items-center justify-center gap-1 text-xs font-medium text-base-content/25 hover:text-info transition-colors" title="Forward">
                      <i data-lucide="forward" class="w-3 h-3"></i>
                      <span class="hidden sm:inline">Forward</span>
                    </button>
                    <span class="read-tick text-primary/50" x-show="m.delivered !== false">
                      <svg class="w-3.5 h-3.5" viewBox="0 0 16 11" fill="none"><path d="M1 5.5L5 9.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 5.5L9 9.5L15 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" x-show="m.read"/></svg>
                    </span>
                    <span x-show="m.edited" class="text-xs text-base-content/25 italic px-0.5">edited</span>
                    <span class="msg-time-hover text-xs text-base-content/25 px-1" x-text="m.time" @click="showMessageInfo(i)" style="cursor: pointer"></span>
                  </div>
                </div>

                <!-- ═══ ERROR MESSAGE (collapsible) ═══ -->
                <div x-show="m.role === 'error'" class="flex justify-center">
                  <details class="group/err max-w-[90%] sm:max-w-[85%] w-full bg-error/10 border border-error/20 rounded-box">
                    <summary class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs text-error cursor-pointer list-none select-none">
                      <i data-lucide="circle-alert" class="w-3 h-3 shrink-0"></i>
                      <span class="font-semibold" x-text="errorTypeText(m)"></span>
                      <span class="group-open/err:hidden text-base-content/40 truncate max-w-[12rem]" x-show="errorMsgText(m)" x-text="errorMsgText(m)"></span>
                      <i data-lucide="chevron-down" class="w-3 h-3 ml-auto transition-transform duration-200 group-open/err:rotate-180 shrink-0"></i>
                    </summary>
                    <div class="px-2.5 pb-2 pt-0.5 space-y-1">
                      <div class="text-error/80 leading-relaxed break-words" x-text="errorMsgText(m)"></div>
                      <div x-show="errorHintText(m)" class="text-xs text-base-content/50 leading-relaxed" x-text="errorHintText(m)"></div>
                      <div x-show="errorIsApi(m)" class="pt-0.5">
                        <button @click="openSettingsTab('providers')"
                          class="flex items-center gap-1.5 text-xs font-semibold text-primary hover:text-primary/80 transition-colors"
                          title="Add or fix your API provider">
                          <i data-lucide="server" class="w-3 h-3 shrink-0"></i>
                          <span>Open Providers</span>
                          <i data-lucide="arrow-right" class="w-3 h-3 shrink-0"></i>
                        </button>
                      </div>
                    </div>
                  </details>
                </div>

                <!-- ═══ ASSISTANT MESSAGE ═══ -->
                <div x-show="m.role === 'assistant'" class="msg-enter flex gap-2 group"
                     @touchstart.passive="swipeStart($event, i)" @touchmove.passive="swipeMove($event)" @touchend="swipeEnd()"
                     @contextmenu.prevent="openContextMenu($event, i)"
                     :style="swipeState.active && swipeState.msgIndex === i ? 'transform: translateX(' + swipeState.currentX + 'px); transition: transform 0.1s ease' : ''">
                  <div class="w-8 h-8 rounded-full overflow-hidden shrink-0 mt-0.5"
                       :class="m.streaming ? 'agent-avatar-pulse' : ''">
                    <img :src="$store.agents.getAgentAvatar(m.senderId, 32)" :alt="m.senderName || 'Agent'" class="w-full h-full object-cover" />
                  </div>
                  <div class="flex-1 min-w-0">
                    <!-- Sender name in group chats -->
                    <div x-show="$store.sessions.activeSession && $store.sessions.activeSession.type === 'group' && m.senderName" class="mb-1 text-xs font-medium" :style="'color: ' + $store.agents.getAgentColor(m.senderId)" x-text="m.senderName"></div>
                    <div class="flex items-center gap-1.5 mb-1">
                      <span x-show="m.subAgent" class="flex items-center gap-1 text-xs font-semibold uppercase tracking-wider text-secondary/80 bg-secondary/10 border border-secondary/20 rounded px-1.5 py-0.5">
                        <i data-lucide="users" class="w-2.5 h-2.5"></i>
                        <span>Sub-agent</span>
                      </span>
                      <span class="text-sm font-medium cursor-pointer hover:underline" :style="'color: ' + $store.agents.getAgentColor(m.senderId)" x-text="m.agent || 'Zod'" @click="showAgentProfile(m.senderId)"></span>
                      <template x-if="m.model">
                        <span class="text-xs rounded px-1.5 py-0.5 bg-base-300 border border-base-content/10 text-base-content/60"
                          x-text="m.model"></span>
                      </template>
                      <span class="msg-time-hover text-xs text-base-content/40" x-text="m.time" @click="showMessageInfo(i)" style="cursor: pointer"></span>
                      <span x-show="m.streaming" class="flex items-center gap-1 text-xs ml-1" :style="'color: ' + $store.agents.getAgentColor(m.senderId)">
                        <span class="braille-loader"></span>
                        <span x-text="(m.senderName || 'Agent') + ' is thinking...'"></span>
                      </span>
                      <span x-show="m.stopped" class="text-xs text-warning/70 ml-1">(stopped)</span>
                      <span x-show="m.edited" class="text-xs text-base-content/25 italic px-0.5">edited</span>
                    </div>
                    <!-- ═══ THINKING (inline) ═══ -->
                    <template x-if="m.thinking && m.thinking.length">
                      <details class="mb-2 group/think">
                        <summary class="flex items-center gap-1.5 text-xs text-base-content/50 hover:text-base-content/70 cursor-pointer list-none">
                          <i data-lucide="brain" class="w-3 h-3 shrink-0"></i>
                          <span class="font-medium">Thinking</span>
                          <span class="group-open/think:hidden text-xs text-base-content/30 truncate max-w-[10rem] ml-1" x-show="(m.thinking || m.thoughts || []).length" x-text="'(' + (m.thinking || m.thoughts || []).length + ')'"></span>
                          <i data-lucide="chevron-down" class="w-3 h-3 ml-auto transition-transform duration-200 group-open/think:rotate-180"></i>
                        </summary>
                        <div class="mt-1.5 ml-4 pl-3 space-y-1.5">
                          <template x-for="(thought, ti) in (m.thinking || m.thoughts || [])" :key="ti">
                            <div class="flex items-start gap-2">
                              <div class="w-1.5 h-1.5 rounded-full bg-accent/40 mt-1 shrink-0"></div>
                              <div class="text-xs text-base-content/60 leading-relaxed" x-text="thought"></div>
                            </div>
                          </template>
                        </div>
                      </details>
                    </template>
                    <!-- ═══ SECURITY WARNING (inline) ═══ -->
                    <template x-if="m.securityWarning">
                      <div class="border border-error/20 bg-error/10 rounded-box px-3 py-2 mb-2 flex items-start gap-2" role="alert">
                        <i data-lucide="octagon-alert" class="w-3.5 h-3.5 shrink-0 mt-0.5 text-error"></i>
                        <div>
                          <span class="text-xs font-semibold block mb-0.5 text-error" x-text="securityTitle(m)"></span>
                          <span class="text-xs text-base-content/60 leading-relaxed" x-text="securityText(m)"></span>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ FINDINGS (inline) ═══ -->
                    <template x-if="m.findings && m.findings.length">
                      <div class="bg-base-300 flex flex-col border border-base-content/10 rounded-box px-3 py-2 mb-2 overflow-x-auto max-w-full">
                        <div class="flex items-center gap-1.5 mb-2">
                          <i data-lucide="list-checks" class="w-3.5 h-3.5 text-base-content/40"></i>
                          <span class="text-xs font-medium text-base-content/60">Findings</span>
                        </div>
                        <div class="space-y-1.5">
                          <template x-for="(f, fi) in (m.findings || [])" :key="fi">
                            <div class="flex items-start gap-2">
                              <div class="w-3 h-3 rounded-full flex items-center justify-center mt-0.5 shrink-0"
                                :class="f.status === 'success' ? 'border border-success/50' : 'border border-warning/50'">
                                <i :data-lucide="f.status === 'success' ? 'check' : 'minus'" class="w-2 h-2"
                                  :class="f.status === 'success' ? 'text-success' : 'text-warning'"></i>
                              </div>
                              <span class="text-xs text-base-content/60 leading-relaxed" x-text="f.text"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ BADGES (inline) ═══ -->
                    <template x-if="m.badges && m.badges.length">
                      <div class="flex flex-wrap gap-1 mb-2">
                        <template x-for="(badge, bi) in (m.badges || [])" :key="bi">
                          <span class="text-xs font-mono rounded px-1.5 py-0.5 border"
                            :class="badge.startsWith('#') ? 'bg-info/10 text-info border-info/20' : badge.startsWith('!') ? 'bg-error/10 text-error border-error/20' : badge.startsWith('$') ? 'bg-secondary/10 text-secondary border-secondary/20' : badge.startsWith('@') ? 'bg-primary/10 text-primary border-primary/20' : 'bg-base-content/10 text-base-content/60 border-base-content/20'"
                            x-text="badge"></span>
                        </template>
                      </div>
                    </template>
                    <!-- ═══ CODE (inline) ═══ -->
                    <template x-if="m.code">
                      <div class="bg-base-300 flex flex-col border border-base-content/10 rounded-box overflow-hidden mb-2">
                        <div class="flex items-center gap-2 px-2.5 py-1 border-b border-base-content/5 bg-base-300/30">
                          <i data-lucide="code" class="w-3 h-3 text-base-content/40"></i>
                          <span class="text-xs text-base-content/40 font-mono" x-text="m.language || 'code'"></span>
                        </div>
                        <div class="p-2 overflow-x-auto">
                          <pre class="text-xs text-base-content/70 font-mono leading-relaxed whitespace-pre-wrap"><span x-text="m.code || m.text"></span></pre>
                        </div>
                      </div>
                    </template>
                <!-- ═══ HEADING NAVIGATION (long responses) ═══ -->
                    <template x-if="msgHeadings(m).length >= 2">
                      <details class="mb-2 group/secnav bg-base-300/50 border border-base-content/10 rounded-box overflow-hidden">
                        <summary class="flex items-center gap-2 px-2.5 py-1.5 text-xs cursor-pointer list-none select-none">
                          <i data-lucide="list-tree" class="w-3.5 h-3.5 text-base-content/40 shrink-0"></i>
                          <span class="font-medium text-base-content/60">Sections</span>
                          <span class="text-xs font-mono text-base-content/30" x-text="msgHeadings(m).length"></span>
                          <i data-lucide="chevron-down" class="w-3 h-3 ml-auto text-base-content/30 transition-transform duration-200 group-open/secnav:rotate-180 shrink-0"></i>
                        </summary>
                        <div class="px-2 pb-2 space-y-0.5">
                          <template x-for="(h, hi) in msgHeadings(m)" :key="'h-' + hi">
                            <button class="w-full flex items-center gap-1.5 text-left text-xs text-base-content/55 hover:text-primary px-2 py-1 rounded hover:bg-base-content/5 transition-colors"
                              @click="gotoHeading(i, hi)">
                              <span class="text-xs font-mono text-base-content/25 shrink-0" x-text="'#'.repeat(h.level)"></span>
                              <span class="truncate" x-text="h.text"></span>
                              <i data-lucide="arrow-right" class="w-3 h-3 ml-auto shrink-0 text-base-content/20"></i>
                            </button>
                          </template>
                        </div>
                      </details>
                    </template>
                    <!-- ═══ TEXT (inline, excludes special roles) ═══ -->
                    <div x-show="m.replyTo" class="msg-reply-quote flex items-center gap-1.5 px-2 py-1 mb-1 rounded text-xs text-base-content/60 cursor-pointer"
                         @click="m.replyTo && scrollToMessage(m.replyTo.index)">
                      <i data-lucide="corner-up-left" class="w-3 h-3 shrink-0 text-primary/60"></i>
                      <span class="font-medium text-primary/70" x-text="m.replyTo && (m.replyTo.agent || m.replyTo.role)"></span>
                      <span class="truncate" x-text="m.replyTo && m.replyTo.text"></span>
                    </div>
                    <div x-show="isInlineTextRole(m)" class="prose text-base-content/85 mb-2 overflow-x-auto max-w-full" x-effect="renderChatHtml($el, m.text)"></div>
                    <!-- ═══ FILES (inline) ═══ -->
                    <template x-if="m.files && m.files.length && m.role !== 'user'">
                      <div class="flex flex-wrap gap-1 mb-2">
                        <template x-for="(fname, fi) in filesArr(m)" :key="fi">
                          <span class="flex items-center gap-1 text-xs bg-base-300/60 text-base-content/60 px-2 py-1 border border-base-content/5 rounded-box">
                            <i data-lucide="file" class="w-3 h-3 text-base-content/30"></i>
                            <span x-text="fnameLabel(fname)"></span>
                          </span>
                        </template>
                      </div>
                    </template>
                    <!-- ═══ TASK COMPLETED (inline) ═══ -->
                    <template x-if="m.taskCompleted">
                      <div class="flex items-center gap-1.5 mb-2">
                        <div class="w-3.5 h-3.5 rounded-full bg-success/15 flex items-center justify-center">
                          <i data-lucide="check" class="w-2.5 h-2.5 text-success"></i>
                        </div>
                        <span class="text-xs text-success">Task completed</span>
                      </div>
                    </template>
                    <!-- ═══ SUGGESTIONS (inline) ═══ -->
                    <template x-if="m.suggested && m.suggested.length">
                      <div class="space-y-1 mb-2">
                        <span class="text-xs text-base-content/30">Suggested:</span>
                        <div class="space-y-1">
                          <template x-for="(sug, si) in (m.suggested || m.suggestions || [])" :key="si">
                            <button class="w-full flex items-center justify-between text-xs bg-base-300/60 hover:bg-base-300 text-base-content/60 hover:text-base-content px-3 py-2 sm:py-1.5 transition-colors text-left rounded-selector"
                              @click="pickSuggestion(sug)">
                              <span x-text="sugText(sug)"></span>
                              <i data-lucide="arrow-right" class="w-3.5 h-3.5 shrink-0 text-base-content/20"></i>
                            </button>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ AGENT (inline) ═══ -->
                    <template x-if="m.agentRun">
                      <div class="mb-3 bg-base-300/80 flex flex-col border border-base-content/10 rounded-box overflow-hidden">
                        <div class="flex items-center justify-between px-3 py-2 border-b border-base-content/5">
                          <div class="flex items-center gap-2">
                            <i :data-lucide="m.subAgent ? 'users' : 'agent'" class="w-4 h-4 shrink-0" :class="m.subAgent ? 'text-secondary/60' : 'text-primary/60'"></i>
                            <span class="text-xs font-medium text-base-content/70" x-text="wfName(m)"></span>
                            <span x-show="m.subAgent" class="text-xs font-mono text-secondary/60 bg-secondary/10 border border-secondary/20 rounded px-1 py-0.5">sub-agent</span>
                          </div>
                          <div class="flex items-center gap-1.5">
                            <span x-show="wfTotalSteps(m) !== undefined" class="text-xs text-base-content/30 font-mono" x-text="wfProgress(m)"></span>
                            <span x-show="wfStatus(m) === 'running'" class="text-xs font-mono uppercase tracking-wider rounded px-1.5 py-0.5 text-primary border border-primary/20">Running</span>
                            <span x-show="wfStatus(m) === 'success'" class="text-xs font-mono uppercase tracking-wider rounded px-1.5 py-0.5 text-success border border-success/20">Complete</span>
                            <span x-show="wfStatus(m) === 'error'" class="text-xs font-mono uppercase tracking-wider rounded px-1.5 py-0.5 text-error border border-error/20">Error</span>
                            <span x-show="wfStatus(m) === 'stopped'" class="text-xs font-mono uppercase tracking-wider rounded px-1.5 py-0.5 text-warning border border-warning/20">Stopped</span>
                          </div>
                        </div>
                        <div class="px-3 py-2 space-y-1">
                          <template x-for="(s, si) in wfSteps(m)" :key="si">
                            <div class="flex items-center gap-2 text-xs">
                              <div x-show="s.status === 'pending'" class="w-5 h-5 rounded-full border border-base-content/20 flex items-center justify-center shrink-0">
                                <span class="text-xs text-base-content/30" x-text="si + 1"></span>
                              </div>
                              <span x-show="s.status === 'running'" class="braille-loader text-primary/70 shrink-0"></span>
                              <div x-show="s.status === 'success'" class="w-5 h-5 rounded-full bg-success/15 flex items-center justify-center shrink-0">
                                <i data-lucide="check" class="w-2.5 h-2.5 text-success"></i>
                              </div>
                              <div x-show="s.status === 'error'" class="w-5 h-5 rounded-full bg-error/15 flex items-center justify-center shrink-0">
                                <i data-lucide="x" class="w-2.5 h-2.5 text-error"></i>
                              </div>
                              <span class="text-base-content/70" x-text="s.label"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ TOOL-RUNS (inline) ═══ -->
                    <template x-if="m.toolRuns && m.toolRuns.length">
                      <template x-for="(tr, ti) in (m.toolRuns || [])" :key="tr.id || ('tool-' + ti)">
                          <details class="mb-2 bg-base-300 border border-base-content/10 rounded-box group/tool" :open="tr.status === 'running' || tr.status === 'error'">
                            <summary class="flex items-center gap-2 px-2.5 py-2 text-xs cursor-pointer list-none">
                              <i :data-lucide="tr.name === 'terminal' ? 'terminal' : tr.name === 'edit' ? 'file-code' : tr.name === 'run_agent_as_subagent' ? 'users' : tr.name.startsWith('@') ? 'bot' : 'bot'" class="w-3.5 h-3.5 shrink-0" :class="tr.name === 'run_agent_as_subagent' || tr.name.startsWith('@') ? 'text-secondary/60' : 'text-base-content/40'"></i>
                              <span class="font-medium capitalize text-base-content/80" x-text="tr.name"></span>
                              <span class="group-open/tool:hidden text-xs text-base-content/30 truncate max-w-[8rem]" x-show="tr.result" x-text="toolResultShort(tr)"></span>
                              <div class="flex-1"></div>
                              <span x-show="tr.status === 'running'" class="flex items-center gap-1 text-xs text-primary/70">
                                <span class="braille-loader text-primary/70"></span> Running
                              </span>
                              <span x-show="tr.status === 'success'" class="flex items-center gap-1 text-xs text-success/70">
                                <i data-lucide="check" class="w-3 h-3"></i> Done
                              </span>
                              <span x-show="tr.status === 'error'" class="flex items-center gap-1 text-xs text-error/70">
                                <i data-lucide="circle-alert" class="w-3 h-3"></i> Failed
                              </span>
                              <i data-lucide="chevron-down" class="w-3 h-3 text-base-content/30 transition-transform duration-200 group-open/tool:rotate-180 shrink-0"></i>
                            </summary>
                          <div class="px-2.5 pb-2 space-y-2">
                            <div x-show="tr.args" class="bg-base-300/40 rounded overflow-hidden">
                              <div class="flex items-center gap-2 px-2.5 py-1 border-b border-base-content/5 bg-base-300/30">
                                <i data-lucide="braces" class="w-3 h-3 text-base-content/40"></i>
                                <span class="text-xs font-mono text-base-content/40">Arguments</span>
                              </div>
                              <pre class="p-1.5 text-xs text-base-content/50 font-mono whitespace-pre-wrap" x-text="toolArgsText(tr)"></pre>
                            </div>
                            <div x-show="tr.status === 'success' && tr.result" class="bg-base-300/40 rounded border border-base-content/5 overflow-hidden">
                              <div class="flex items-center gap-2 px-2.5 py-1 border-b border-base-content/5 bg-base-300/30">
                                <i data-lucide="file-code" class="w-3 h-3 text-base-content/40"></i>
                                <span class="text-xs font-mono text-base-content/40">Result</span>
                              </div>
                              <div class="p-2 overflow-x-auto">
                                <pre class="text-xs text-base-content/70 font-mono leading-relaxed whitespace-pre-wrap" x-text="toolResultText(tr)"></pre>
                              </div>
                            </div>
                            <div x-show="tr.status === 'error'" class="border border-error/20 bg-error/10 rounded-box px-3 py-2 flex items-start gap-2" role="alert">
                              <i data-lucide="octagon-alert" class="w-3.5 h-3.5 shrink-0 mt-0.5 text-error"></i>
                              <div class="min-w-0">
                                <span class="text-xs font-semibold block mb-0.5 text-error">Tool error</span>
                                <span class="text-xs text-base-content/60 leading-relaxed break-words" x-text="tr.error"></span>
                                <span class="block text-xs text-base-content/40 mt-1 leading-relaxed">The AI was given this error plus the tool's parameters so it can <span class="text-primary font-medium">retry with valid arguments</span>.</span>
                              </div>
                            </div>
                            <div x-show="tr.status === 'running'" class="flex items-center gap-2 text-xs text-base-content/50">
                              <span class="braille-loader text-primary/70"></span>
                              Running...
                            </div>
                          </div>
                        </details>
                      </template>
                    </template>
                    <!-- ═══ CONFIRMATION (inline) ═══ -->
                    <template x-if="m.confirmationPlan">
                      <div class="bg-base-300 flex flex-col border border-base-content/10 rounded-box px-3 py-2 mb-2 overflow-x-auto max-w-full">
                        <div class="flex items-center gap-1.5 mb-2">
                          <i data-lucide="clipboard-list" class="w-3.5 h-3.5 text-warning/60"></i>
                          <span class="text-xs font-medium text-base-content/60">Confirmation Plan</span>
                        </div>
                        <p class="text-xs text-base-content/60 leading-relaxed mb-2" x-text="m.confirmationPlan || m.text"></p>
                        <div x-show="m.confirmationAuto === false" class="mt-2 flex items-center gap-2 text-xs text-base-content/40">
                          <i data-lucide="timer-off" class="w-3 h-3"></i>
                          <span><span class="text-primary font-medium">Requires confirmation</span> before proceeding</span>
                        </div>
                        <div x-show="m.confirmationAuto === false" class="mt-2 flex items-center gap-2">
                          <button @click="approvePlan(i)" class="inline-flex items-center gap-1.5 min-h-8 px-3 text-xs font-medium text-success border border-success/20 bg-success/10 hover:bg-success/20 rounded-field transition-colors">
                            <i data-lucide="check" class="w-3 h-3"></i>
                            <span class="hidden sm:inline">Approve</span>
                          </button>
                          <button @click="rejectPlan(i)" class="inline-flex items-center gap-1.5 min-h-8 px-3 text-xs font-medium text-error border border-error/20 bg-error/10 hover:bg-error/20 rounded-field transition-colors">
                            <i data-lucide="x" class="w-3 h-3"></i>
                            <span class="hidden sm:inline">Reject</span>
                          </button>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ INLINE CONFIRM (askUser) ═══ -->
                    <template x-if="m.confirmQuestion">
                      <div class="mb-2">
                        <div x-show="m.confirmPending" class="bg-primary/5 border border-primary/20 px-3 py-3 rounded-box">
                          <div class="flex items-center gap-2 mb-2">
                            <div class="w-6 h-6 rounded-full bg-primary/15 flex items-center justify-center shrink-0">
                              <i data-lucide="help-circle" class="w-3.5 h-3.5 text-primary"></i>
                            </div>
                            <span class="text-xs font-semibold text-primary/80">Confirmation needed</span>
                          </div>
                          <p class="text-sm text-base-content/80 leading-relaxed mb-3 ml-8" x-text="m.confirmQuestion"></p>
                          <div class="flex gap-2 ml-8">
                            <button @click="answerConfirm(true)" class="inline-flex items-center gap-1.5 min-h-8 px-3 text-xs font-medium text-success border border-success/20 bg-success/10 hover:bg-success/20 rounded-field transition-colors">
                              <i data-lucide="check" class="w-3.5 h-3.5"></i> Yes
                            </button>
                            <button @click="answerConfirm(false)" class="inline-flex items-center gap-1.5 min-h-8 px-3 text-xs font-medium text-base-content/70 border border-base-content/15 hover:bg-base-content/5 rounded-field transition-colors">
                              <i data-lucide="x" class="w-3.5 h-3.5"></i> No
                            </button>
                          </div>
                        </div>
                        <div x-show="!m.confirmPending" class="flex items-center gap-2 px-3 py-2">
                          <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
                            :class="m.confirmAnswer === 'yes' ? 'bg-success/15' : 'bg-base-300'">
                            <i :data-lucide="m.confirmAnswer === 'yes' ? 'check' : 'x'" class="w-3 h-3"
                              :class="m.confirmAnswer === 'yes' ? 'text-success' : 'text-base-content/40'"></i>
                          </div>
                          <span class="text-xs text-base-content/50" x-text="m.confirmAnswer === 'yes' ? 'Confirmed' : 'Declined'"></span>
                          <span class="text-xs text-base-content/25" x-text="m.time"></span>
                        </div>
                      </div>
                    </template>
                    <!-- ═══ TEAM FEEDBACK (inline) ═══ -->

                <i data-lucide="git-branch" class="w-4 h-4 text-base-content/50"></i> Fork at this message

              <button @click="contextMenuAction('rewind')" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-base-content hover:bg-base-content/5 transition-colors">

              <button @click="contextMenuAction('restore')" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-base-content hover:bg-base-content/5 transition-colors">

              <div class="h-px bg-base-content/10 my-0.5"></div>
              <button @click="contextMenuAction('delete')" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-error hover:bg-error/5 transition-colors">

        <!-- ═══ SESSION EVENT HISTORY (fork/rewind log) ═══ -->

                    </button>
                  </template>
                  <div x-show="filteredCommands.length === 0" class="px-4 py-4 text-center text-xs text-base-content/30">No commands found</div>

            <!-- Reply preview -->
            <div x-show="replyingTo" x-transition:enter="transition ease-out duration-150"

            <!-- Pending files -->

                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </span>
              </template>
            </div>

            <!-- Input row -->
            <div class="relative flex items-end gap-2 px-3 pb-2">
              <!-- Full input field -->
              <div class="composer-field flex-1 min-w-0 relative">
                <!-- Textarea fills the field -->
                <textarea x-ref="textarea" x-model="chatInput"
                  @keydown.enter.prevent="chatOnEnter()"

                  @keydown.arrow-up.prevent="chatArrowUp()"
                  @keydown.escape="chatEscape()"
                  @input="chatInputChanged($el)"
                  placeholder="Enter to send"
                  class="composer-input w-full bg-transparent outline-none resize-none border-0 px-3 py-3 min-h-[5rem] max-h-[50vh]"
                  rows="1"></textarea>
              </div>
            </div>

            <!-- Agent chip + context + send (below textarea) -->
            <div class="flex items-center gap-2 px-3 pb-2">
              <div class="relative shrink-0">
                <button @click="chatAgentOpen = !chatAgentOpen"
                  class="composer-agent"
                  :title="selectedAgentId ? 'Running: ' + selectedAgentLabel : 'Select an agent'">
                  <div x-show="!selectedAgentId" class="w-5 h-5 rounded-full bg-primary/15 flex items-center justify-center">
                    <i data-lucide="bot" class="w-3 h-3 text-primary/70"></i>
                  </div>
                  <div x-show="selectedAgentId" class="w-5 h-5 rounded-full overflow-hidden">
                    <img :src="$store.agents.getAgentAvatar(selectedAgentId, 20)" class="w-full h-full object-cover" />
                  </div>
                  <span class="max-w-[6rem] truncate" x-text="selectedAgentId ? selectedAgentLabel : 'Agent'"></span>
                  <i data-lucide="chevron-down" class="w-3 h-3 text-base-content/30"></i>
                </button>
                <div x-show="chatAgentOpen" @click.outside="chatAgentOpen = false" x-cloak
                  x-effect="chatAgentOpen && refreshIconsSoon()"
                  class="absolute bottom-full left-0 mb-1 w-56 sm:w-64 max-h-72 overflow-y-auto scrollbar-thin bg-base-200 border border-base-content/10 z-50 py-1 rounded-box">
                  <button @click="pickAgent('')"
                    class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-base-content/5"
                    :class="!selectedAgentId ? 'bg-base-content/10' : ''">
                    <i data-lucide="message-circle" class="w-3.5 h-3.5 text-base-content/40 shrink-0"></i>
                    <span class="flex-1 truncate">No agent</span>
                    <span class="text-xs font-mono text-base-content/30 shrink-0">chat</span>
                  </button>
                  <div class="my-1 mx-3 h-px bg-base-content/10"></div>
                  <template x-for="h in agentOptions" :key="h.id">
                    <button @click="pickAgent(h.id)"
                      class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-base-content/5"
                      :class="selectedAgentId === h.id ? 'bg-base-content/10' : ''">
                      <div class="w-6 h-6 rounded-full overflow-hidden shrink-0">
                        <img :src="$store.agents.getAgentAvatar(h.id, 24)" :alt="h.name" class="w-full h-full object-cover" />
                      </div>
                      <span class="flex-1 truncate" x-text="h.name"></span>
                      <span class="text-xs font-mono text-base-content/30 shrink-0" x-text="h.steps + ' steps'"></span>
                    </button>
                  </template>
                  <div class="my-1 mx-3 h-px bg-base-content/10"></div>
                  <button @click="chatCloseManage()"
                    class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-base-content/5 text-base-content/60">
                    <i data-lucide="settings" class="w-3.5 h-3.5 shrink-0"></i>
                    <span class="flex-1 truncate">Manage agents...</span>
                  </button>
                </div>
              </div>
              <!-- Context -->
              <div x-show="contextPct > 0" class="flex items-center gap-1.5">
                <span class="text-[0.65rem] text-base-content/30">ctx</span>
                <div class="w-12 h-1.5 bg-base-content/8 rounded-full overflow-hidden">
                  <div class="h-full rounded-full transition-all duration-300" :style="'width:' + contextPct + '%; background:' + contextColor"></div>
                </div>
                <span class="text-[0.65rem] font-mono text-base-content/30 tabular-nums" x-text="contextPct + '%'"></span>
              </div>
              <!-- Spacer -->
              <div class="flex-1"></div>
              <!-- Send / Stop -->
              <button @click="aiWorking ? stopChat() : sendChat()"
                class="composer-send-mini"
                :class="aiWorking ? 'stop' : (chatInput.trim().length > 0 || pendingFiles.length ? 'can-send' : '')"
                :disabled="!aiWorking && chatInput.trim().length === 0 && !pendingFiles.length"
                :title="aiWorking ? 'Stop generating' : 'Send'">
                <i data-lucide="square" x-show="aiWorking" class="w-4 h-4 fill-current"></i>
                <i data-lucide="arrow-up" x-show="!aiWorking" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- Status footer -->
            <div x-show="aiWorking || messageQueue.length" class="composer-status">
              <div class="flex items-center gap-2">
                <div x-show="aiWorking" class="flex items-center gap-1.5 text-xs text-primary/80">
                  <span class="braille-loader text-primary"></span>
                  <span class="font-medium">Working</span>
                </div>
                <div x-show="messageQueue.length" class="flex items-center gap-1 text-xs font-mono text-base-content/40" :title="messageQueue.length + ' message(s) queued'">
                  <i data-lucide="list-ordered" class="w-3 h-3"></i>
                  <span x-text="messageQueue.length + ' queued'"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Composer moved into messages.html (inside bg-panel flex column) -->

    </main>

    <!-- ═══ HUB PANEL (right side: settings + pages) ═══ -->
    <aside class="hub-panel">
      <div class="hub-inner">
              <template x-if="separateView || $store.ui.settingsOpen">
        <div class="flex-1 min-h-0 flex flex-col relative">

          <!-- ═══ AGENT → full editor page ═══ -->
      <template x-if="separateView && separateView.kind === 'agent'">
        <div class="flex-1 min-h-0 flex flex-col bg-panel">
                <div class="shrink-0 border-b border-base-content/10 bg-panel">
                  <div class="flex items-center gap-1 sm:gap-2 px-3 sm:px-3 py-2.5">
                    <button @click="goBack()"
                      class="min-h-8 min-w-8 flex items-center justify-center text-base-content/40 hover:text-base-content transition-colors rounded-selector shrink-0"
                      title="Close">
                      <i data-lucide="x" class="w-4 h-4"></i>
                                          </button>
                    <span class="w-px h-5 bg-base-content/10 shrink-0"></span>
                    <i :data-lucide="separateView.icon || 'layers'" class="size-4 shrink-0 text-base-content/60"></i>
                    <div class="truncate text-sm font-medium text-base-content flex-1 min-w-0">
                      <span x-text="separateView.title"></span>
                      <span class="text-xs font-normal text-base-content/30" x-text="separateView.hint ? ' · ' + separateView.hint : ''"></span>
                    </div>
                    <!-- List / Node view toggle -->
                    <div class="flex gap-1 p-1 bg-base-300 rounded-selector shrink-0">
                      <button type="button" @click="$store.ui.agentView = 'list'"
                        class="min-h-7 px-2.5 rounded-field text-xs font-medium transition-colors"
                        :class="$store.ui.agentView !== 'node' ? 'bg-panel text-base-content' : 'text-base-content/50 hover:text-base-content'">List</button>
                      <button type="button" @click="$store.ui.agentView = 'node'"
                        class="min-h-7 px-2.5 rounded-field text-xs font-medium transition-colors"

                    </div>
                    <span class="text-xs font-mono text-base-content/25 border border-base-content/10 rounded-field px-1.5 py-0.5 shrink-0 hidden sm:inline">esc</span>
                  </div>
                </div>
                <div class="flex-1 min-h-0 flex flex-col">
                  <template x-if="$store.ui.agentView !== 'node'">
                    <div class="flex-1 min-h-0 flex justify-center overflow-hidden">
                      <div class="w-full  flex flex-col min-h-0 h-full">
                          <!-- Agent editor: plain prompt steps, everything inline -->
  <div x-data="agentBuilderPanel" class="flex-1 min-h-0 flex flex-col">
    <template x-if="!active">
      <div class="flex-1 flex flex-col items-center justify-center gap-3 text-center p-4">
        <i data-lucide="layers" class="w-8 h-8 text-base-content/25"></i>
        <p class="text-xs text-base-content/40">No agent yet. Create one to start building your agent.</p>
        <button type="button" @click="newAgent()"
          class="inline-flex items-center gap-1.5 min-h-8 px-3 text-xs font-medium text-primary/80 hover:text-primary hover:bg-primary/10 rounded-field transition-colors">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>New agent
        </button>
      </div>
    </template>

    <template x-if="active">
      <div class="flex-1 min-h-0 flex flex-col">
        <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4 py-3" @scroll="acOpen && acClose()">

          <!-- Agent title -->
          <div class="flex items-center gap-2 mb-1">
            <input type="text" :value="active.name || ''" @input="updateName($el.value)" spellcheck="false"
              class="flex-1 min-w-0 bg-transparent text-sm font-semibold font-mono text-base-content outline-none placeholder:text-base-content/30 border-0"
              placeholder="Agent name" />
            <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-secondary/70 border border-secondary/20" x-text="'agent'"></span>
            <button type="button" @click="restoreDefault()"
              :title="confirmRestore ? 'Click again to reset this agent to the built-in defaults' : 'Update this agent to the built-in defaults'"
              class="min-h-7 min-w-7 flex items-center justify-center transition-colors shrink-0 rounded-selector"
              :class="confirmRestore ? 'text-success bg-success/10' : 'text-base-content/40 hover:text-primary hover:bg-base-300/50'">
              <i :data-lucide="confirmRestore ? 'check' : 'refresh-cw'" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <p class="pb-3 text-xs text-base-content/30"><span class="text-primary font-medium" x-text="'Agent'"></span> — <span x-show="isAgent" x-cloak>steps run in order below; <span class="text-primary font-medium">0</span> is the system prompt.</span><span x-show="!isAgent" x-cloak>no steps, so it runs as a direct agent (or a skill/prompt) using its system prompt and tools. Add a step to turn it into an agent.</span> Author each step as a plain prompt and declare everything inline with mentions — <span class="text-primary font-medium font-mono">@name</span> for tools/agents and <span class="text-primary font-medium font-mono">>type</span> for render types. Type <span class="text-primary font-medium font-mono">@</span> or <span class="text-primary font-medium font-mono">&gt;</span> to auto-complete.</p>

          <div class="divide-y divide-base-content/5">

            <!-- Step 0: system prompt -->
            <div class="group py-2.5">
              <div class="flex items-start gap-2.5">
                <span class="text-xs font-mono text-base-content/30 w-4 text-right shrink-0">0</span>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-0.5">
                    <span class="text-sm font-mono text-base-content">System prompt</span>
                    <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-base-content/40 border border-base-content/10">system</span>
                    <button type="button" @click="sysOpen = !sysOpen" title="Toggle system prompt"
                      class="min-h-6 min-w-6 flex items-center justify-center rounded-field text-base-content/40 hover:text-primary hover:bg-base-300/50 transition-colors shrink-0">
                      <i data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform duration-200" :class="sysOpen && 'rotate-180'"></i>
                    </button>
                  </div>
                  <div x-show="sysOpen">
                    <textarea :value="active.system || ''" @input="sysInput($el)" spellcheck="false"
                      x-effect="sysInputEffect($el, active.system, sysOpen)"
                      class="w-full bg-transparent text-xs text-base-content/60 leading-relaxed outline-none resize-none overflow-hidden placeholder:text-base-content/25 border-0"
                      placeholder="System prompt — shapes the agent across all steps…"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <!-- Agent-level tools (optional) -->
            <div class="group py-2.5">
              <div class="flex items-center gap-2 mb-0.5">
                <span class="text-sm font-mono text-base-content">Tools</span>
                <span class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-base-content/40 border border-base-content/10">optional</span>
              </div>
              <input type="text" list="agentToolList" :value="(active.tools || []).join(', ')" @input="updateToolsFromInput($el)" spellcheck="false"
                class="w-full bg-transparent text-xs text-base-content/60 outline-none placeholder:text-base-content/25 border-0"
                placeholder="e.g. memory, todo, code_tools — leave blank for all tools" />
              <datalist id="agentToolList">
                <template x-for="tn in toolNames" :key="tn">
                  <option :value="tn"></option>
                </template>
              </datalist>
              <p class="pt-1 text-xs text-base-content/30">Tool names available to every step (and to the whole agent when there are no steps). Per-step <span class="font-mono text-primary/80">@mentions</span> still add more.</p>
            </div>

            <template x-for="(s, i) in steps" :key="'hstep-' + i">
              <div class="group py-2.5">
                <div class="flex items-start gap-2.5">
                  <span class="text-xs font-mono text-base-content/30 w-4 text-right shrink-0" x-text="i + 1"></span>
                  <div class="flex-1 min-w-0">
                    <!-- Step header: name + actions -->
                    <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mb-0.5">
                      <input type="text" :value="s.name || ''" @input="stepPatch(i, { name: $el.value })" spellcheck="false"
                        class="flex-1 min-w-0 bg-transparent text-sm font-mono text-base-content outline-none placeholder:text-base-content/30 border-0"
                        placeholder="step name" />
                      <span x-show="hasDup(i)" x-cloak title="Duplicate step name — gotos will only find the first"
                        class="text-xs font-mono uppercase tracking-wider rounded px-1 py-0.5 shrink-0 text-warning border border-warning/20">dup</span>

                  <div class="flex items-center gap-2.5 py-2.5">

          <!-- ═══ INSTALL & DOWNLOADS ═══ -->

            <details class="group/install" open>
              <summary class="flex items-center gap-2 sticky top-0 z-10 bg-panel/95 backdrop-blur-sm -mx-3 sm:-mx-4 px-3 sm:px-4 pt-3 pb-1 cursor-pointer list-none select-none">

                    <i data-lucide="puzzle" class="w-4 h-4 shrink-0 text-base-content/40"></i>

                      <i data-lucide="download" class="w-3 h-3"></i> Install
                    </a>
                  </div>
                </div>
              </div>
            </details>
          </div>

          <!-- ═══ DATA ═══ -->

                  </div>
                </div>
              </div>
            </details>

                      <button x-show="!confirmReset" @click="beginReset()"

                      <div x-show="confirmReset" x-cloak class="flex flex-wrap items-center gap-2">

                          @keydown.enter.prevent="confirmResetEnter()"

          <!-- ═══ PROVIDERS ═══ -->

          <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 sm:px-4 py-3 space-y-6">

                No providers yet. Add one to start chatting.
              </div>
